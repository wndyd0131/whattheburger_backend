                    productResponses:
                      - id: 9001
                        storeProductId: 3001
                        quantity: 2
                        name: Whataburger
                        basePrice: 6.29
                        extraPrice: 1.49
                        totalPrice: 15.56
                        imageSource: products/whataburger.png
                        calculatedCalories: 670.0
                        productType: ONLY
                        customRuleResponses:
                          - id: 8001
                            customRuleId: 900
                            name: Add Extras
                            calculatedPrice: 1.49
                            optionResponses:
                              - id: 7001
                                productOptionId: 5001
                                name: Bacon
                                countType: COUNTABLE
                                basePrice: 1.49
                                calculatedPrice: 1.49
                                calculatedCalories: 80.0
                                quantity: 1
                                quantityDetail:
                                  productOptionOptionQuantityId: 21
                                  quantityType: Regular
                                  extraPrice: 0.00
