# OpenAPI 3.1 specification for the Whattheburger backend.
#
# Reverse-engineered from the Spring Boot source in src/main/java. Where the code
# and the intended contract appear to disagree, the discrepancy is called out in the
# operation description rather than silently "fixed" here.
openapi: 3.1.0

info:
  title: Whattheburger API
  version: 1.0.0
  summary: Ordering API for the Whattheburger storefront (menu, cart, order session, Stripe checkout).
  description: |
    REST API backing the Whattheburger client. The API is stateless: authentication is
    carried by a JWT bearer token, and unauthenticated ("guest") traffic is correlated by
    a `guestId` cookie.

    ## Authentication

    `POST /api/v1/login` returns an `accessToken` and a `refreshToken` in the JSON response
    body. The client stores them itself and sends the access token on subsequent requests as
    `Authorization: Bearer <accessToken>`.

    Token facts, taken from `JwtTokenUtil`:

    - Algorithm `HS256`. The signing key is generated at application startup, so **all
      previously issued tokens become invalid whenever the server restarts**.
    - Access token lifetime: 30 minutes. Refresh token lifetime: 7 days.
    - The only claims are `sub` (the user's email), `iat` and `exp`. No user id and no roles
      are embedded in the token.
    - There is **no refresh endpoint**. The refresh token is issued but cannot be redeemed.

    ## Guest identity

    `GuestFilter` runs on every request. If no `guestId` cookie is present it issues one
    (`HttpOnly`, `Secure`, `SameSite=None`, `Max-Age=30d`, `Path=/`). Cart, order-session and
    checkout endpoints read that cookie to scope the guest's data in Redis.

    Because the filter only *sets* the cookie on the response, the **first** request a fresh
    client makes to an endpoint that declares `guestId` as required will still fail with 400
    (`Required cookie 'guestId' ... is not present`). Clients must make one warm-up request
    first.

    ## Authorization

    Authorization is configured centrally in `SecurityConfig` and is currently very sparse:

    | Rule | Effect |
    | --- | --- |
    | `GET /api/v1/users` | authenticated |
    | `GET /api/v1/products` | role `ADMIN` |
    | `GET /api/v1/order/**` | authenticated |
    | everything else | `permitAll()` |

    Every operation below documents its *effective* protection under `security`. Note that
    write endpoints that look administrative (`POST /api/v1/products`,
    `POST /api/v1/store/product`, `POST /api/v1/store/{storeId}/product/{storeProductId}`)
    are in fact publicly reachable.

    ## Errors

    `GlobalExceptionHandler` renders every handled exception as an `ErrorResponse`
    (`message`, `status`, `timestamp`). 401s raised inside the security filter chain are
    rendered by `CustomAuthenticationEntryPoint` using the same shape, but with a generic
    `"Authentication failed"` message.

    Any exception without a dedicated handler falls through to a catch-all that returns
    **500** with the raw exception message. Several conditions that ought to be 4xx
    currently surface as 500 this way; they are flagged per operation.
  contact:
    name: Whattheburger backend
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development (profile `dev`, no servlet context path)
  - url: '{scheme}://{host}'
    description: Deployed environment
    variables:
      scheme:
        default: https
        enum: [http, https]
      host:
        default: localhost:8080

tags:
  - name: Auth
    description: Login and token issuance.
  - name: User
    description: Sign-up and reading the authenticated user's profile.
  - name: Catalog
    description: Global (store-independent) menu catalog — categories, products, options, option traits.
  - name: Store
    description: Store lookup, including geospatial "near me" search.
  - name: StoreProduct
    description: Per-store menu — availability, pricing overrides and option overrides.
  - name: Cart
    description: Redis-backed, store-scoped cart for both guests and authenticated users.
  - name: OrderSession
    description: Short-lived snapshot of a cart that is being taken through checkout.
  - name: Order
    description: Persisted orders and order history.
  - name: Checkout
    description: Stripe Checkout session creation and webhook ingestion.
  - name: Internal
    description: Endpoints that are unfinished, unused, or not intended for clients.

security: []

paths:
  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /api/v1/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Log in and obtain JWT tokens
      description: |
        Authenticates an email/password pair through Spring Security's
        `AuthenticationManager` (BCrypt-hashed passwords) and returns a freshly minted
        access token and refresh token in the response body.

        No cookie or response header is set — the client is responsible for storing the
        tokens and attaching `Authorization: Bearer <accessToken>` to later requests.

        The refresh token is returned for forward compatibility only; there is currently no
        endpoint that accepts it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                summary: Standard login
                value:
                  email: burger.lover@example.com
                  password: 'Str0ngPassw0rd!'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                default:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJidXJnZXIubG92ZXJAZXhhbXBsZS5jb20iLCJpYXQiOjE3NTU5MDAwMDAsImV4cCI6MTc1NTkwMTgwMH0.tIB2Q1kqQ0FQ8m1n2mYs5Kx8VYhO4pC0uZLd0R6mQ9c
                    refreshToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJidXJnZXIubG92ZXJAZXhhbXBsZS5jb20iLCJpYXQiOjE3NTU5MDAwMDAsImV4cCI6MTc1NjUwNDgwMH0.qN7pXo4v1t9wZ5xGm3bF0hRk2dJcYuA8sLpE6nV1wTk
        '401':
          description: |
            Wrong password (`BadCredentialsException`). Handled by `GlobalExceptionHandler`,
            so the raw Spring Security message is echoed back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                badCredentials:
                  value:
                    message: Bad credentials
                    status: 401
                    timestamp: '2026-08-23T13:05:12.482'
        '500':
          description: |
            **Contract smell.** An unknown email raises
            `UsernameNotFoundException("No such user")`, which has no dedicated handler and
            therefore falls through to the catch-all as 500. Semantically this should be 401.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownEmail:
                  value:
                    message: No such user
                    status: 500
                    timestamp: '2026-08-23T13:05:12.482'

  # ---------------------------------------------------------------------------
  # User
  # ---------------------------------------------------------------------------
  /api/v1/signup:
    post:
      operationId: signUp
      tags: [User]
      summary: Register a new user
      description: |
        Creates a user with the fixed role `USER` and a BCrypt-hashed password, and returns
        the generated id.

        No tokens are issued — the client must call `POST /api/v1/login` afterwards.

        `SecurityConfig` explicitly permits `POST /api/v1/register`, not `/api/v1/signup`.
        This endpoint is only reachable because of the blanket `anyRequest().permitAll()`
        fallback.

        No field on `UserCreateRequest` carries a Bean Validation constraint and the handler
        does not use `@Valid`, so blank or malformed values are accepted and persisted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            examples:
              default:
                value:
                  firstName: Casey
                  lastName: Nguyen
                  phoneNum: '+15125550137'
                  zipCode: '78701'
                  email: casey.nguyen@example.com
                  password: 'Str0ngPassw0rd!'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
              examples:
                default:
                  value:
                    userId: 42
        '400':
          description: |
            Malformed JSON body. Note that field-level problems are *not* rejected here —
            an empty `email` or `password` is accepted because nothing is validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            **Contract smell.** A duplicate email raises
            `IllegalArgumentException("The user already exists")`, which has no dedicated
            handler and is reported as 500. This should be 409 (or 400).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateEmail:
                  value:
                    message: The user already exists
                    status: 500
                    timestamp: '2026-08-23T13:07:44.011'

  /api/v1/users:
    get:
      operationId: getCurrentUser
      tags: [User]
      summary: Get the authenticated user's profile
      description: |
        Returns the profile of the caller identified by the bearer token. There is no
        endpoint for fetching an arbitrary user by id.

        Authorization is enforced by `SecurityConfig`
        (`GET /api/v1/users` → `authenticated()`), so an anonymous caller is rejected by the
        filter chain before the handler runs.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile of the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserReadResponse'
              examples:
                default:
                  value:
                    userId: 42
                    firstName: Casey
                    lastName: Nguyen
                    phoneNum: '+15125550137'
                    email: casey.nguyen@example.com
                    zipcode: '78701'
                    role: USER
        '401':
          $ref: '#/components/responses/FilterChainUnauthorized'

  # ---------------------------------------------------------------------------
  # Catalog
  # ---------------------------------------------------------------------------
  /api/v1/category:
    get:
      operationId: listCategories
      tags: [Catalog]
      summary: List all menu categories
      description: |
        Returns every category together with the number of products assigned to it.
        Publicly accessible. The array is returned as-is with no pagination or envelope.
      security: []
      responses:
        '200':
          description: All categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryReadResponse'
              examples:
                default:
                  value:
                    - categoryId: 1
                      name: Burgers
                      productCount: 12
                    - categoryId: 2
                      name: Chicken & More
                      productCount: 8
                    - categoryId: 3
                      name: Drinks
                      productCount: 15

  /api/v1/options:
    get:
      operationId: listOptions
      tags: [Catalog]
      summary: List all global options (ingredients / add-ons)
      description: |
        Returns the catalog of options that products can reference — bacon, cheese, drink
        sizes, and so on — along with the quantity variants defined for each.

        `imageSource` is returned as a fully qualified URL built from `aws.s3.public-url`,
        or `null` when the option has no image. This differs from other endpoints in the API
        that return a bare S3 object key.
      security: []
      responses:
        '200':
          description: All options.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OptionReadResponse'
              examples:
                default:
                  value:
                    - optionId: 7
                      optionName: Bacon
                      imageSource: https://cdn.example.com/whataburger/options/bacon.png
                      optionCalories: 80.0
                      quantityDetails:
                        - id: 21
                          quantityType: Regular
                        - id: 22
                          quantityType: Extra
                    - optionId: 9
                      optionName: Fries
                      imageSource: null
                      optionCalories: 320.0
                      quantityDetails:
                        - id: 31
                          quantityType: Small
                        - id: 32
                          quantityType: Medium
                        - id: 33
                          quantityType: Large

  /api/v1/optionTraits:
    get:
      operationId: listOptionTraits
      tags: [Catalog]
      summary: List all option traits
      description: |
        Returns the catalog of option traits — boolean-style modifiers layered on top of an
        option, such as "grilled" or "on the side". Only `BINARY` traits exist today.

        Note the camelCase path segment `optionTraits`, which is inconsistent with the
        lowercase, singular style used elsewhere (`/api/v1/category`, `/api/v1/store`).
      security: []
      responses:
        '200':
          description: All option traits.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OptionTraitReadResponse'
              examples:
                default:
                  value:
                    - optionTraitId: 3
                      name: Grilled
                      labelCode: GRILLED
                      optionTraitType: BINARY
                    - optionTraitId: 4
                      name: On the side
                      labelCode: ON_THE_SIDE
                      optionTraitType: BINARY

  /api/v1/products:
    get:
      operationId: listProducts
      tags: [Catalog]
      summary: List all products in the global catalog
      description: |
        Returns the flat, store-independent product catalog.

        **This is the only read endpoint restricted to `ADMIN`**
        (`SecurityConfig`: `GET /api/v1/products` → `hasRole("ADMIN")`). Storefront clients
        should use the per-store endpoints
        (`GET /api/v1/store/{storeId}/product`, `GET /api/v1/store/{storeId}/category/product`)
        instead.

        `imageSource` is the raw S3 object key here, not a URL.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductReadResponse'
              examples:
                default:
                  value:
                    - productId: 101
                      name: Whataburger
                      price: 5.99
                      calories: 590.0
                      briefInfo: The original, made to order.
                      imageSource: products/whataburger.png
                      productType: ONLY
                    - productId: 102
                      name: Whataburger Meal
                      price: 9.49
                      calories: 1180.0
                      briefInfo: Burger, fries and a drink.
                      imageSource: products/whataburger-meal.png
                      productType: MEAL
        '401':
          $ref: '#/components/responses/FilterChainUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createProduct
      tags: [Catalog]
      summary: Create a product with its options and custom rules
      description: |
        Creates a global catalog product in a single multipart request: the JSON definition
        in the `productBlob` part and the image in the `productImage` part. The image is
        uploaded to S3 and the returned key is stored on the product.

        Both parts are mandatory. A missing part yields 400 from Spring's argument
        resolution rather than a domain error.

        **This endpoint is unauthenticated.** `SecurityConfig` has no rule for
        `POST /api/v1/products`, so it is covered by `anyRequest().permitAll()` — anyone can
        write to the catalog. The `ADMIN` restriction is applied to the `GET` on the same
        path but not the `POST`.

        The response body is a bare `text/plain` string, not JSON, and does not include the
        id of the created product. A `ProductCreateResponseDTO` exists in the codebase but is
        never returned.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [productBlob, productImage]
              properties:
                productBlob:
                  $ref: '#/components/schemas/ProductCreateRequest'
                productImage:
                  type: string
                  format: binary
                  description: Product image. Uploaded to S3; the resulting object key is stored as `imageSource`.
            encoding:
              productBlob:
                contentType: application/json
              productImage:
                contentType: image/png, image/jpeg
            examples:
              default:
                summary: A burger with one custom rule
                value:
                  productImage: '<binary PNG content of the productImage part>'
                  productBlob:
                    productName: Whataburger
                    productPrice: 5.99
                    productCalories: 590.0
                    productType: ONLY
                    briefInfo: The original, made to order.
                    categoryIds: [1]
                    customRuleRequests:
                      - customRuleName: Add Extras
                        customRuleType: FREE
                        orderIndex: 0
                        minSelection: 0
                        maxSelection: 5
                        optionRequests:
                          - optionId: 7
                            isDefault: false
                            countType: COUNTABLE
                            defaultQuantity: 0
                            maxQuantity: 3
                            extraPrice: 1.25
                            orderIndex: 0
                            quantityDetails:
                              - id: 21
                                quantityType: Regular
                                isDefault: true
                                extraPrice: 0.00
                            optionTraitRequests:
                              - optionTraitId: 3
                                defaultSelection: 0
                                extraPrice: 0.00
                                extraCalories: 0.0
      responses:
        '201':
          description: Product created. Plain-text confirmation, no identifier.
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: Product successfully created
        '400':
          description: A required multipart part is missing or `productBlob` is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            A referenced `categoryId`, `optionId` or `optionTraitId` does not exist
            (`CategoryNotFoundException`, `OptionNotFoundException`,
            `OptionTraitNotFoundException`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownOption:
                  value:
                    message: Option with ID[7] not found
                    status: 404
                    timestamp: '2026-08-23T13:12:03.771'
        '500':
          description: S3 upload failure or any other unhandled error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/products/{productId}:
    get:
      operationId: getProductById
      tags: [Catalog]
      summary: Get one catalog product with its full option tree
      description: |
        Returns a product plus every selectable option, flattened into `optionResponses`.
        Each entry carries its parent custom rule inline as `customRuleResponse`, so clients
        must group by `customRuleResponse.customRuleId` themselves to render the
        rule-by-rule configurator.

        This is the store-independent view; prices and availability come from the global
        catalog. For what a specific store actually sells, use
        `GET /api/v1/store/{storeId}/product/{storeProductId}`.

        Note that the `ProductReadByProductIdDto.toDto` mapper never populates
        `productCalories`, so this field is always `null` even when the product has a
        calorie value.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The product and its options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductReadByProductId'
              examples:
                default:
                  value:
                    productId: 101
                    productName: Whataburger
                    productPrice: 5.99
                    productCalories: null
                    imageSource: https://cdn.example.com/whataburger/products/whataburger.png
                    briefInfo: The original, made to order.
                    optionResponses:
                      - productOptionId: 5001
                        name: Bacon
                        isDefault: false
                        defaultQuantity: 0
                        maxQuantity: 3
                        extraPrice: 1.25
                        calories: 80.0
                        countType: COUNTABLE
                        imageSource: options/bacon.png
                        orderIndex: 0
                        customRuleResponse:
                          customRuleId: 900
                          name: Add Extras
                          customRuleType: FREE
                          orderIndex: 0
                          minSelection: 0
                          maxSelection: 5
                        quantityDetailResponses:
                          - id: 21
                            quantityType: Regular
                            labelCode: REGULAR
                            extraPrice: 0.00
                            extraCalories: 0.0
                            isDefault: true
                        optionTraitResponses:
                          - productOptionTraitId: 7001
                            name: Grilled
                            labelCode: GRILLED
                            optionTraitType: BINARY
                            defaultSelection: 0
                            extraPrice: 0.00
                            extraCalories: 0.0
        '400':
          $ref: '#/components/responses/PathVariableTypeMismatch'
        '404':
          description: No product with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: Product with ID[999] not found
                    status: 404
                    timestamp: '2026-08-23T13:14:20.004'

  /api/v1/products/category/{categoryId}:
    get:
      operationId: listProductsByCategory
      tags: [Catalog]
      summary: List catalog products in a category
      description: |
        Returns a summary view of the products assigned to a category.

        The item shape here differs from `GET /api/v1/products`: the identifier field is
        named `id` rather than `productId`, and `productType` is absent. Clients cannot reuse
        one model for both endpoints.

        An unknown `categoryId` yields `200` with an empty array rather than `404`.
      security: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Products in the category. Empty array if the category is unknown or empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductReadByCategoryIdResponse'
              examples:
                default:
                  value:
                    - id: 101
                      name: Whataburger
                      price: 5.99
                      calories: 590.0
                      imageSource: products/whataburger.png
                      briefInfo: The original, made to order.
                empty:
                  summary: Unknown or empty category
                  value: []
        '400':
          $ref: '#/components/responses/PathVariableTypeMismatch'

  /:
    get:
      operationId: getProductByIdsStub
      tags: [Internal]
      summary: Unimplemented bulk product lookup
      deprecated: true
      description: |
        `ProductController.getProductByIds` is a bare `@GetMapping` with no path, so it is
        mapped to the servlet root. The method body only reads `productIds` off the bound
        request object and returns `void`, producing an empty `200`.

        It is not wired to any service and should not be called. Documented only because it
        is a live, reachable route that also occupies `GET /`.
      security: []
      parameters:
        - name: productIds
          in: query
          required: false
          description: Bound via POJO query-parameter binding. Ignored by the handler.
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
      responses:
        '200':
          description: Empty body.

  # ---------------------------------------------------------------------------
  # Store
  # ---------------------------------------------------------------------------
  /api/v1/store:
    get:
      operationId: listStores
      tags: [Store]
      summary: List all stores
      description: |
        Returns every store.

        **Only `storeId`, `overpassId` and `houseNumber` are populated.** `StoreController`
        builds `StoreResponseDto` with just those three fields, so `openTime`, `closeTime`,
        `branch`, `address`, `coordinate`, `phoneNum` and `website` are always `null` even
        though the schema declares them and the underlying entity holds values. Use
        `GET /api/v1/store/nearby` for a populated store record.
      security: []
      responses:
        '200':
          description: All stores, sparsely populated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreResponse'
              examples:
                default:
                  value:
                    - storeId: 1
                      overpassId: 358294712
                      houseNumber: 1200
                      openTime: null
                      closeTime: null
                      branch: null
                      address: null
                      coordinate: null
                      phoneNum: null
                      website: null

  /api/v1/store/nearby:
    get:
      operationId: listNearbyStores
      tags: [Store]
      summary: Find stores within a radius of a coordinate
      description: |
        Geospatial search for stores within `radiusMeter` of the given longitude/latitude,
        enriched with driving `distance` and `duration` from a routing provider (Mapbox).

        All three query parameters are mandatory; omitting any of them produces 400. There is
        no cap on `radiusMeter`, and no pagination — a large radius returns every match and
        triggers a routing call per store.

        As with `GET /api/v1/store`, `openTime`, `closeTime` and `website` are not populated
        by the mapper and are always `null`.
      security: []
      parameters:
        - name: lon
          in: query
          required: true
          description: Longitude of the search origin, in decimal degrees (WGS 84).
          schema:
            type: number
            format: double
          example: -97.7431
        - name: lat
          in: query
          required: true
          description: Latitude of the search origin, in decimal degrees (WGS 84).
          schema:
            type: number
            format: double
          example: 30.2672
        - name: radiusMeter
          in: query
          required: true
          description: Search radius in meters. Not validated or capped.
          schema:
            type: number
            format: double
          example: 5000
      responses:
        '200':
          description: Matching stores ordered by the repository's geospatial result order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NearByStoreReadResponse'
              examples:
                default:
                  value:
                    - storeId: 1
                      overpassId: null
                      houseNumber: 1200
                      openTime: null
                      closeTime: null
                      branch: Downtown Austin
                      address:
                        city: Austin
                        street: Congress Ave
                        state: TX
                        zipcode: '78701'
                      coordinate:
                        longitude: -97.7431
                        latitude: 30.2672
                      phoneNum: '+15125550100'
                      website: null
                      distance: 812.4
                      duration: 168.0
                empty:
                  summary: Nothing within the radius
                  value: []
        '400':
          description: A required parameter is missing or is not a valid number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The upstream routing provider failed or returned an unexpected payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # StoreProduct
  # ---------------------------------------------------------------------------
  /api/v1/store/product:
    post:
      operationId: registerProductToStores
      tags: [StoreProduct]
      summary: Register one catalog product to several stores
      description: |
        Creates a `StoreProduct` link for each store id, making the catalog product
        orderable at those stores with the catalog's default price and options.

        The operation is not atomic per store: the first store that already carries the
        product aborts the request with 400, and whether earlier links survive depends on
        transaction boundaries in `StoreProductService`.

        **This endpoint is unauthenticated** despite the `// Admin` comment in the handler —
        it falls under `anyRequest().permitAll()`.

        Like `POST /api/v1/products`, the response is a `text/plain` string with no
        identifiers. `StoreProductCreateResponseDto` exists but is never used.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProductCreateRequest'
            examples:
              default:
                value:
                  storeIds: [1, 2, 5]
                  productId: 101
      responses:
        '201':
          description: Links created.
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: StoreProducts successfully created
        '400':
          description: The product is already registered to one of the stores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyExists:
                  value:
                    message: Store with ids [1] already has Product with id [101]
                    status: 400
                    timestamp: '2026-08-23T13:20:41.229'
        '404':
          description: The product or one of the stores does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                storeNotFound:
                  value:
                    message: Store with ID[5] not found
                    status: 404
                    timestamp: '2026-08-23T13:20:41.229'

  /api/v1/store/{storeId}/category/product:
    get:
      operationId: listCategorizedStoreProducts
      tags: [StoreProduct]
      summary: List a store's menu grouped by category
      description: |
        The primary storefront menu endpoint: returns the store's products already grouped
        into categories and ordered by `orderIndex`, with store-specific prices applied.

        Only products actually available at the store are included, so a category with no
        available products is omitted entirely.

        Note that products here are keyed by `storeProductId`, not the catalog `productId`.
        That id is what the cart and the product-detail endpoint expect.
      security: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: The store's categorized menu.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorizedStoreProductsRead'
              examples:
                default:
                  value:
                    - categoryId: 1
                      categoryName: Burgers
                      orderIndex: 0
                      products:
                        - storeProductId: 3001
                          name: Whataburger
                          price: 6.29
                          calories: 590.0
                          briefInfo: The original, made to order.
                          imageSource: products/whataburger.png
                          productType: ONLY
                    - categoryId: 3
                      categoryName: Drinks
                      orderIndex: 2
                      products:
                        - storeProductId: 3055
                          name: Sweet Tea
                          price: 2.19
                          calories: 180.0
                          briefInfo: Brewed fresh daily.
                          imageSource: products/sweet-tea.png
                          productType: ONLY
        '400':
          $ref: '#/components/responses/PathVariableTypeMismatch'
        '404':
          $ref: '#/components/responses/StoreNotFound'

  /api/v1/store/{storeId}/product:
    get:
      operationId: listStoreProducts
      tags: [StoreProduct]
      summary: List a store's menu as a flat array
      description: |
        Returns the same menu as `GET /api/v1/store/{storeId}/category/product` but flat,
        with each product carrying the categories it belongs to (and its ordering within
        each). Useful for clients that build their own grouping or need a product to appear
        under multiple categories.

        Unlike the categorized variant, the identifier field here is named `productId` even
        though `StoreProductService` populates it with the **store product** id. The naming
        is misleading; the value is the same one `.../product/{storeProductId}` expects.
      security: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: The store's menu, flat.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreProductsRead'
              examples:
                default:
                  value:
                    - productId: 3001
                      name: Whataburger
                      price: 6.29
                      calories: 590.0
                      briefInfo: The original, made to order.
                      imageSource: products/whataburger.png
                      productType: ONLY
                      categories:
                        - categoryId: 1
                          orderIndex: 0
        '400':
          $ref: '#/components/responses/PathVariableTypeMismatch'
        '404':
          $ref: '#/components/responses/StoreNotFound'

  /api/v1/store/{storeId}/product/{storeProductId}:
    get:
      operationId: getStoreProduct
      tags: [StoreProduct]
      summary: Get a store product with its full option tree
      description: |
        The store-specific counterpart of `GET /api/v1/products/{productId}`: same option
        tree, but with the store's price overrides, option overrides and hidden options
        applied. This is what the product configurator should read before posting to the
        cart.

        `storeProductId` must belong to `storeId`; a mismatch is rejected with 400
        (`StoreProductStoreMismatchException`) rather than 404.
      security: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/StoreProductId'
      responses:
        '200':
          description: The store product and its options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductReadByProductId'
              examples:
                default:
                  value:
                    storeProductId: 3001
                    productName: Whataburger
                    productPrice: 6.29
                    productCalories: 590.0
                    imageSource: https://cdn.example.com/whataburger/products/whataburger.png
                    briefInfo: The original, made to order.
                    optionResponses:
                      - productOptionId: 5001
                        name: Bacon
                        isDefault: false
                        defaultQuantity: 0
                        maxQuantity: 2
                        extraPrice: 1.49
                        calories: 80.0
                        countType: COUNTABLE
                        imageSource: options/bacon.png
                        orderIndex: 0
                        customRuleResponse:
                          customRuleId: 900
                          name: Add Extras
                          customRuleType: FREE
                          orderIndex: 0
                          minSelection: 0
                          maxSelection: 5
                        quantityDetailResponses:
                          - id: 21
                            quantityType: Regular
                            labelCode: REGULAR
                            extraPrice: 0.00
                            extraCalories: 0.0
                            isDefault: true
                        optionTraitResponses:
                          - productOptionTraitId: 7001
                            name: Grilled
                            labelCode: GRILLED
                            optionTraitType: BINARY
                            defaultSelection: 0
                            extraPrice: 0.00
                            extraCalories: 0.0
        '400':
          description: |
            `storeProductId` does not belong to `storeId`
            (`StoreProductStoreMismatchException`), or a path variable is not a valid integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                mismatch:
                  value:
                    message: StoreProduct with ID[3001] does not belong to store with ID[2]
                    status: 400
                    timestamp: '2026-08-23T13:26:09.512'
        '404':
          description: The store or the store product does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: StoreProduct with ID[9999] not found
                    status: 404
                    timestamp: '2026-08-23T13:26:09.512'
    post:
      operationId: modifyStoreProduct
      tags: [StoreProduct]
      summary: Apply store-specific overrides to a store product
      description: |
        Applies a delta to a store product: a new price, and per-custom-rule / per-option /
        per-trait / per-quantity changes selected by `modifyType`
        (`ADD`, `DELETE`, `OVERRIDE`, `HIDE`).

        Two contract problems worth noting:

        - **`POST` is used for a partial update.** `PATCH` (or `PUT`) would match the
          semantics; a client cannot distinguish this from a create.
        - **The handler returns `void`**, so a success is an empty `200` with no body. The
          client has no way to read back the applied state and must re-`GET` the product.
          `StoreProductModifyResponseDto` exists in the codebase but has no fields and is
          never returned.

        Like the other write endpoints in this tag, it is unauthenticated. `omitted` fields
        are not distinguishable from explicit `null`, because the request DTO has no
        JSON-null handling.
      security: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/StoreProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProductModifyRequest'
            examples:
              priceAndOptionOverride:
                summary: Raise the price and override one option
                value:
                  productPrice: 6.79
                  customRuleRequests:
                    - customRuleId: 900
                      modifyType: OVERRIDE
                      optionRequests:
                        - productOptionId: 5001
                          isDefault: false
                          defaultQuantity: 0
                          maxQuantity: 1
                          extraPrice: 1.99
                          orderIndex: 0
                          modifyType: OVERRIDE
                          quantityRequest:
                            - productOptionOptionQuantityId: 21
                              quantityType: Regular
                              isDefault: true
                              extraPrice: 0.00
                          optionTraitRequests:
                            - productOptionTraitId: 7001
                              defaultSelection: 0
                              extraPrice: 0.25
                              modifyType: OVERRIDE
              hideOption:
                summary: Hide an option at this store
                value:
                  productPrice: 6.29
                  customRuleRequests:
                    - customRuleId: 900
                      modifyType: OVERRIDE
                      optionRequests:
                        - productOptionId: 5001
                          modifyType: HIDE
      responses:
        '200':
          description: Overrides applied. **Empty body.**
        '400':
          description: |
            The store product does not belong to the store, or a `modifyType` is not
            supported for the target
            (`ModificationStrategyNotSupportedException` surfaces as 500, see below).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            The store, store product, custom rule, product option, product option trait or
            quantity referenced in the body does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                customRuleNotFound:
                  value:
                    message: CustomRule with ID 900 not found
                    status: 404
                    timestamp: '2026-08-23T13:29:55.318'
        '500':
          description: |
            **Contract smell.** `ModificationStrategyNotSupportedException` and
            `TraitCalcStrategyNotSupportedException` are declared with status 500, so an
            invalid `modifyType`/trait combination in the *request* is reported as a server
            error instead of 400.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedStrategy:
                  value:
                    message: ModificationStrategy is not supported for requested modify type
                    status: 500
                    timestamp: '2026-08-23T13:29:55.318'

  # ---------------------------------------------------------------------------
  # Cart
  # ---------------------------------------------------------------------------
  /api/v1/store/{storeId}/cart:
    post:
      operationId: addToCart
      tags: [Cart]
      summary: Add a configured product to the cart
      description: |
        Validates the requested option selections against the store product's custom rules
        and stock, prices the line item, and appends it to the store-scoped cart in Redis.

        The cart is keyed by owner and store: `cart:store:{storeId}:{email}` for an
        authenticated caller, `cart:store:{storeId}:{guestId}` otherwise. A user therefore
        has an independent cart per store, and a guest cart and a user cart never
        automatically converge — see `PATCH /api/v1/store/{storeId}/cart` (merge).

        This is the only cart operation where `guestId` is optional. It is still required in
        practice for guests: without a token *and* without the cookie the request fails with
        `CartOwnerRequiredException` (400).

        **The response is the single created line item, not the cart.** Every other cart
        operation returns the whole `CartResponse`. Clients that keep local cart state must
        special-case this.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/GuestIdCookieOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartCreateRequest'
            examples:
              default:
                summary: One burger with bacon
                value:
                  storeProductId: 3001
                  quantity: 2
                  customRuleRequests:
                    - customRuleId: 900
                      optionRequests:
                        - productOptionId: 5001
                          optionQuantity: 1
                          isSelected: true
                          quantityDetailRequest:
                            id: 21
                          optionTraitRequests:
                            - productOptionTraitId: 7001
                              currentValue: 1
      responses:
        '201':
          description: The created line item, priced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartProductResponse'
              examples:
                default:
                  value:
                    storeProductId: 3001
                    productName: Whataburger
                    productType: ONLY
                    basePrice: 6.29
                    imageSource: products/whataburger.png
                    briefInfo: The original, made to order.
                    calories: 670.0
                    quantity: 2
                    productExtraPrice: 1.49
                    productTotalPrice: 15.56
                    customRuleResponses:
                      - customRuleId: 900
                        customRuleName: Add Extras
                        customRuleType: FREE
                        orderIndex: 0
                        minSelection: 0
                        maxSelection: 5
                        customRuleTotalPrice: 1.49
                        optionResponses:
                          - productOptionId: 5001
                            optionName: Bacon
                            isDefault: false
                            defaultQuantity: 0
                            optionQuantity: 1
                            maxQuantity: 2
                            basePrice: 1.49
                            baseCalories: 80.0
                            imageSource: options/bacon.png
                            isSelected: true
                            countType: COUNTABLE
                            orderIndex: 0
                            optionTotalPrice: 1.49
                            quantityDetailResponse:
                              selectedId: 21
                              quantityDetails:
                                - quantityId: 21
                                  labelCode: REGULAR
                                  extraPrice: 0.00
                                  extraCalories: 0.0
                                  isDefault: true
                                  quantityType: Regular
                            optionTraitResponses:
                              - productOptionTraitId: 7001
                                currentValue: 1
                                labelCode: GRILLED
                                optionTraitName: Grilled
                                optionTraitType: BINARY
                                defaultSelection: 0
                                basePrice: 0.00
                                baseCalories: 0.0
                                traitTotalPrice: 0.00
        '400':
          description: |
            Domain validation failed. Common causes:

            - `CartOwnerRequiredException` — neither a bearer token nor a `guestId` cookie.
            - `CartItemLimitExceededException` — the cart is already at its item cap.
            - `InvalidOptionRequestException` — quantity/selection invalid for the option's
              `countType`.
            - `HiddenOptionSelectedException` — the option is hidden at this store.
            - `InsufficientOptionStockException` — the store lacks ingredient stock.
            - `StoreProductNotInStoreException` / `StoreProductStoreMismatchException`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ownerRequired:
                  value:
                    message: Guest ID or authenticated user is required
                    status: 400
                    timestamp: '2026-08-23T13:35:02.660'
                insufficientStock:
                  value:
                    message: 'Insufficient stock for productOption [5001] ingredient [77]: needed 2, available 0'
                    status: 400
                    timestamp: '2026-08-23T13:35:02.660'
        '404':
          description: The store, store product, custom rule, product option or quantity does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: getCart
      tags: [Cart]
      summary: Get the current cart for a store
      description: |
        Returns every line item in the caller's cart for this store plus the cart total.

        An empty or never-created cart returns `200` with `productResponses: []` and a
        `cartTotalPrice` of `0`, not `404`.

        Prices are recomputed on read against current store data, so the total can change
        between calls if the store's pricing changed.

        Unlike the `POST`, the `guestId` cookie is **required** here — including for
        authenticated callers, who do not otherwise need it. Omitting it is a 400 even with a
        valid token.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/GuestIdCookieRequired'
      responses:
        '200':
          description: The cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              examples:
                empty:
                  summary: Empty cart
                  value:
                    productResponses: []
                    cartTotalPrice: 0
        '400':
          $ref: '#/components/responses/MissingGuestIdCookie'
        '404':
          $ref: '#/components/responses/StoreNotFound'
    patch:
      operationId: mergeCart
      tags: [Cart]
      summary: Merge the guest cart into the authenticated user's cart
      description: |
        Intended for the moment a guest logs in: moves the items accumulated under
        `cart:store:{storeId}:{guestId}` into `cart:store:{storeId}:{email}` and returns the
        merged cart.

        **This operation is effectively unprotected.** `CartService.mergeCart` is annotated
        `@PreAuthorize("hasRole('USER')")`, but the application never enables method
        security (`@EnableMethodSecurity` is absent), so the annotation is inert and
        `SecurityConfig` has no matching rule. An anonymous caller reaches the service and
        fails deeper, at `getUserKey`, with a bare `IllegalStateException` reported as **500**
        rather than 401.

        The endpoint has no request body — the source cart is identified purely by the
        `guestId` cookie and the target by the token.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/GuestIdCookieRequired'
      responses:
        '200':
          description: The merged cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/MissingGuestIdCookie'
        '404':
          $ref: '#/components/responses/StoreNotFound'
        '500':
          description: |
            **Contract smell.** Called without authentication: `getUserKey` throws
            `IllegalStateException` with no message, which the catch-all renders as 500 with
            a `null` message. Should be 401.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                anonymousCaller:
                  value:
                    message: null
                    status: 500
                    timestamp: '2026-08-23T13:40:18.902'
    delete:
      operationId: clearCart
      tags: [Cart]
      summary: Remove every item from the cart
      description: |
        Empties the caller's cart for this store and returns the resulting (empty) cart.
        Idempotent — clearing an already-empty cart succeeds.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/GuestIdCookieRequired'
      responses:
        '200':
          description: The now-empty cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              examples:
                default:
                  value:
                    productResponses: []
                    cartTotalPrice: 0
        '400':
          $ref: '#/components/responses/MissingGuestIdCookie'
        '404':
          $ref: '#/components/responses/StoreNotFound'

  /api/v1/store/{storeId}/cart/{cartIdx}:
    get:
      operationId: getCartItem
      tags: [Cart]
      summary: Get one cart line item by position
      description: |
        Returns a single line item, addressed by its **zero-based position** in the cart.

        Positional addressing is fragile: `cartIdx` is not a stable identifier. Any
        concurrent add or delete shifts the indices of later items, so a client that caches
        an index can read or mutate the wrong line. There is no per-item id in the cart
        contract.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CartIdx'
        - $ref: '#/components/parameters/GuestIdCookieRequired'
      responses:
        '200':
          description: The line item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartProductResponse'
        '400':
          description: |
            No item at that index (`InvalidCartIndexException`), the `guestId` cookie is
            missing, or the cart owner could not be resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidIndex:
                  value:
                    message: No item at index 4
                    status: 400
                    timestamp: '2026-08-23T13:42:31.104'
        '404':
          description: The store does not exist, or the cart key holds nothing (`CartNotFoundException`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteCartItem
      tags: [Cart]
      summary: Remove one cart line item by position
      description: |
        Deletes the line item at `cartIdx` and returns the full remaining cart.

        **Not idempotent in the useful sense:** removing index 2 shifts every later item down
        by one, so repeating the same call deletes a *different* item. Clients should re-read
        indices from the returned cart after each mutation.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CartIdx'
        - $ref: '#/components/parameters/GuestIdCookieRequired'
      responses:
        '200':
          description: The cart after removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: No item at that index, or the `guestId` cookie is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/StoreNotFound'

  /api/v1/store/{storeId}/cart/{cartIdx}/option:
    patch:
      operationId: modifyCartItemOptions
      tags: [Cart]
      summary: Replace the option selections on a cart line item
      description: |
        Re-configures the options of an existing line item and re-prices the cart.

        `customRuleRequests` is a **full replacement**, not a delta: any custom rule or
        option omitted from the body is treated as deselected. Clients should send back the
        complete selection they want, typically by editing the structure they read from the
        cart.

        The `quantity` of the line item is not touched here — use
        `PATCH /api/v1/store/{storeId}/cart/{cartIdx}/product`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CartIdx'
        - $ref: '#/components/parameters/GuestIdCookieRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartOptionModifyRequest'
            examples:
              deselectBacon:
                summary: Deselect the bacon that was previously added
                value:
                  customRuleRequests:
                    - customRuleId: 900
                      optionRequests:
                        - productOptionId: 5001
                          optionQuantity: 0
                          isSelected: false
                          optionTraitRequests: []
      responses:
        '200':
          description: The cart after re-configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: |
            Invalid index, missing `guestId` cookie, or the new selection violates the
            product's rules — `InvalidOptionRequestException`,
            `HiddenOptionSelectedException`, `InsufficientOptionStockException`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The store, custom rule, product option or quantity does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/store/{storeId}/cart/{cartIdx}/product:
    patch:
      operationId: modifyCartItemQuantity
      tags: [Cart]
      summary: Change the quantity of a cart line item
      description: |
        Sets the line item's quantity (absolute, not a delta) and re-prices the cart.

        Only `quantity` is read from the body. The DTO also declares `storeId`, which the
        handler ignores in favour of the path variable — sending a conflicting value has no
        effect and is not rejected.

        `quantity` is an unvalidated primitive `int`: `0` and negative values are accepted by
        the binding layer, and how they are handled depends on the calculator rather than an
        explicit rule. There is no "remove when quantity reaches 0" behaviour; use `DELETE`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CartIdx'
        - $ref: '#/components/parameters/GuestIdCookieRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartProductModifyRequest'
            examples:
              default:
                value:
                  storeId: 1
                  quantity: 3
      responses:
        '200':
          description: The cart after the quantity change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: No item at that index, missing `guestId` cookie, or stock is insufficient for the new quantity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/StoreNotFound'

  # ---------------------------------------------------------------------------
  # Order session
  # ---------------------------------------------------------------------------
  /api/v1/order-session/store/{storeId}:
    post:
      operationId: createOrderSession
      tags: [OrderSession]
      summary: Snapshot the cart into an order session
      description: |
        Freezes the caller's current cart for this store into an `OrderSession` stored in
        Redis, and returns it with a generated `sessionId`. The session is the input to
        `POST /api/v1/checkout/{orderSessionId}`.

        The cart is **not** cleared by this call, and nothing prevents creating several
        sessions from the same cart.

        Sessions expire. Once expired, reads fail with `ExpiredOrderSessionException`, which
        is declared with status **404** rather than 410/409.

        **Known defect for guests.** `OrderService.createOrderSession` does
        `if (authentication.isAuthenticated())` and then casts the principal to
        `UserDetailsImpl`. Anonymous authentication is enabled, so for an unauthenticated
        caller `isAuthenticated()` is `true` while the principal is the string
        `"anonymousUser"` — the cast throws `ClassCastException` and the request fails with
        **500**. Despite being `permitAll()`, this endpoint currently only works for
        authenticated callers.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/GuestIdCookieRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderSessionCreateRequest'
            examples:
              pickup:
                value:
                  orderType: PICK_UP
              delivery:
                value:
                  orderType: DELIVERY
      responses:
        '201':
          description: The created order session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSessionResponse'
              examples:
                default:
                  value:
                    sessionId: 4f1a9c2e-8b3d-4a77-9c11-2e6f7d8a9b01
                    storeId: 1
                    totalPrice: 15.56
                    orderStatus: PENDING
                    orderType: PICK_UP
                    paymentStatus: PENDING
                    paymentMethod: null
                    orderNote: null
                    discountType: null
                    taxAmount: 1.28
                    guestInfo:
                      guestId: 9d5b1f30-6c4a-4f2e-8b77-0a1c2d3e4f50
                    productResponses:
                      - id: 1
                        storeProductId: 3001
                        quantity: 2
                        name: Whataburger
                        basePrice: 6.29
                        extraPrice: 1.49
                        totalPrice: 15.56
                        imageSource: products/whataburger.png
                        calculatedCalories: 670.0
                        productType: ONLY
                        customRuleResponses:
                          - id: 1
                            customRuleId: 900
                            name: Add Extras
                            calculatedPrice: 1.49
                            optionResponses:
                              - id: 1
                                productOptionId: 5001
                                name: Bacon
                                countType: COUNTABLE
                                basePrice: 1.49
                                calculatedPrice: 1.49
                                calculatedCalories: 80.0
                                quantity: 1
                                quantityDetail:
                                  productOptionOptionQuantityId: 21
                                  quantityType: Regular
                                  extraPrice: 0.00
                                  extraCalories: 0.0
                                traitResponses:
                                  - id: 1
                                    productOptionTraitId: 7001
                                    name: Grilled
                                    labelCode: GRILLED
                                    basePrice: 0.00
                                    calculatedPrice: 0.00
                                    calculatedCalories: 0.0
                                    optionTraitType: BINARY
                                    selectedValue: 1
        '400':
          description: Missing `guestId` cookie, unresolvable cart owner, or an invalid `orderType`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The store does not exist, or there is no cart to snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            **Known defect.** `ClassCastException` for unauthenticated callers, as described
            above. Also covers an empty cart, which is not guarded by an explicit check
            (`EmptyCartException` exists in the codebase but is an empty stub that does not
            extend `Exception` and is never thrown).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                anonymousCaller:
                  value:
                    message: class java.lang.String cannot be cast to class com.whattheburger.backend.security.UserDetailsImpl
                    status: 500
                    timestamp: '2026-08-23T13:50:07.443'

  /api/v1/order-session/{sessionId}/store/{storeId}:
    get:
      operationId: getOrderSession
      tags: [OrderSession]
      summary: Get an order session by id
      description: |
        Loads an order session and verifies it belongs to `storeId`.

        **No ownership check.** The handler accepts `guestId` and `Authentication` but
        `OrderService.loadOrderSession` ignores both — the session-key check is commented
        out. Any caller who knows a `sessionId` (a UUID) can read the full session, including
        the guest's contact details once checkout has populated them. This is an IDOR.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderSessionIdPath'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/GuestIdCookieRequired'
      responses:
        '200':
          description: The order session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSessionResponse'
        '400':
          description: Missing `guestId` cookie, or `sessionId` is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            The session does not exist, has expired, or belongs to a different store — all
            three collapse into `OrderSessionNotFoundException` / `ExpiredOrderSessionException`
            with status 404, so a client cannot tell them apart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: Order session with UUID[4f1a9c2e-8b3d-4a77-9c11-2e6f7d8a9b01] not found
                    status: 404
                    timestamp: '2026-08-23T13:52:44.190'
                expired:
                  value:
                    message: Order session has been expired
                    status: 404
                    timestamp: '2026-08-23T13:52:44.190'

  /api/v1/order-session/checkout-session/{sessionId}:
    get:
      operationId: getOrderSessionByCheckoutSessionId
      tags: [OrderSession]
      summary: Get an order session by Stripe Checkout session id
      description: |
        Resolves a Stripe Checkout session id (`cs_...`) to the order session behind it.
        Intended for the page Stripe redirects to, which knows the Stripe id but not the
        internal `sessionId`.

        No authentication, no `guestId`, and no ownership check of any kind — knowledge of
        the Stripe session id is the only credential. Note the closely named sibling
        `GET /api/v1/order/checkout-session/{sessionId}`, which returns the *persisted order*
        instead and does require authentication.
      security: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Stripe Checkout Session id.
          schema:
            type: string
          example: cs_test_a1B2c3D4e5F6g7H8i9J0kLmNoPqRsTuVwXyZ
      responses:
        '200':
          description: The order session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSessionResponse'
        '404':
          description: |
            No mapping for that Stripe session id, or the order session has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            **Contract smell.** `CheckoutService.getOrderSessionId` can return a value that
            is not a UUID, in which case `UUID.fromString` throws
            `IllegalArgumentException` and the catch-all reports 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Order
  # ---------------------------------------------------------------------------
  /api/v1/order/list:
    get:
      operationId: listOrders
      tags: [Order]
      summary: List the authenticated user's orders
      description: |
        Returns a page of the caller's order history plus a total count.

        Authentication is enforced by `SecurityConfig` (`GET /api/v1/order/**` →
        `authenticated()`), so there is no guest order history.

        `pageNumber` is zero-based. Neither `pageNumber` nor `pageSize` is validated: a
        negative `pageNumber` or a non-positive `pageSize` reaches
        `PageRequest.of` and raises `IllegalArgumentException`, reported as **500**.

        `orderCount` is the total number of matching orders, not the number of items in
        `orders`.
      security:
        - bearerAuth: []
      parameters:
        - name: sort
          in: query
          required: false
          description: Sort order.
          schema:
            $ref: '#/components/schemas/OrderSortType'
          example: CREATED_AT_DESC
        - name: pageNumber
          in: query
          required: false
          description: Zero-based page index. Not validated.
          schema:
            type: integer
            format: int32
            default: 0
          example: 0
        - name: pageSize
          in: query
          required: false
          description: Page size. Not validated and not capped.
          schema:
            type: integer
            format: int32
            default: 10
          example: 10
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
              examples:
                default:
                  value:
                    orderCount: 2
                    orders:
                      - id: 5001
                        orderNumber: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        storeId: 1
                        createdAt: '2026-08-22T18:31:04Z'
                        updatedAt: '2026-08-22T18:44:12Z'
                        totalPrice: 15.56
                        orderStatus: COMPLETED
                        orderType: PICK_UP
                      - id: 4980
                        orderNumber: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
                        storeId: 2
                        createdAt: '2026-08-14T12:02:55Z'
                        updatedAt: '2026-08-14T12:40:31Z'
                        totalPrice: 28.14
                        orderStatus: CANCELLED
                        orderType: DELIVERY
                empty:
                  summary: No orders yet
                  value:
                    orderCount: 0
                    orders: []
        '400':
          description: '`sort` is not one of the `OrderSortType` values.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/FilterChainUnauthorized'
        '500':
          description: |
            **Contract smell.** Invalid pagination (`pageNumber < 0`, `pageSize <= 0`)
            surfaces as 500 instead of 400.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                badPageSize:
                  value:
                    message: Page size must not be less than one
                    status: 500
                    timestamp: '2026-08-23T13:58:26.335'

  /api/v1/order/{orderNumber}/detail:
    get:
      operationId: getOrderDetail
      tags: [Order]
      summary: Get one of the authenticated user's orders in full
      description: |
        Returns a complete order: line items with the full option tree, payment and card
        summary, contact and delivery address, and the store.

        The lookup is scoped to the caller's user id, so another user's `orderNumber`
        produces 404 rather than 403. Requires authentication
        (`GET /api/v1/order/**` → `authenticated()`), meaning **guests cannot retrieve their
        own orders through this endpoint**.

        `orderNumber` is the public UUID of the order, not the numeric `id` that also appears
        in the payload.

        Field naming here is inconsistent with the rest of the API because of Jackson
        renames: the wire names are `productResponses`, `customRuleResponses`,
        `optionResponses` and `traitResponses`, while the Java fields are
        `productResponse`, `customRuleResponseDtos`, `optionResponseDtos` and
        `traitResponseDtos`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
