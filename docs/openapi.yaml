  /api/v1/order/checkout-session/{sessionId}:
    get:
      operationId: getOrderByCheckoutSessionId
      tags: [Order]
      summary: Get the persisted order for a Stripe Checkout session
      description: |
        Resolves a Stripe Checkout session id to the order that was created from it. This is
        what the post-payment confirmation page reads.

        Two things to be aware of:

        - **No ownership check.** `OrderService.loadOrderByCheckoutSessionId` accepts
          `guestId` and `Authentication` but uses neither; any caller with the Stripe session
          id gets the full order, contact details included.
        - **Guests cannot use it anyway.** The path matches
          `GET /api/v1/order/**` → `authenticated()`, so an unauthenticated caller is stopped
          at the filter chain with 401 — even though the handler is written to accept a
          `guestId` cookie. Guest order confirmation is therefore broken via this route; the
          usable guest path is `GET /api/v1/order-session/checkout-session/{sessionId}`.
        - The order becomes available only after Stripe's webhook has been processed, so a
          client redirected back from Stripe may need to retry on 404.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Stripe Checkout Session id.
          schema:
            type: string
          example: cs_test_a1B2c3D4e5F6g7H8i9J0kLmNoPqRsTuVwXyZ
        - $ref: '#/components/parameters/GuestIdCookieRequired'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '400':
          $ref: '#/components/responses/MissingGuestIdCookie'
        '401':
          $ref: '#/components/responses/FilterChainUnauthorized'
        '404':
          description: |
            No order for that Stripe session id — either the id is wrong or the webhook has
            not been processed yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notYetPersisted:
                  value:
                    message: Order not found
                    status: 404
                    timestamp: '2026-08-23T14:05:38.902'

  # ---------------------------------------------------------------------------
  # Checkout
  # ---------------------------------------------------------------------------
  /api/v1/checkout/{orderSessionId}:
    post:
      operationId: createCheckoutSession
      tags: [Checkout]
      summary: Attach the order form to a session and start Stripe Checkout
      description: |
        Two steps in one call: the contact/fulfilment form is written onto the order session,
        then a Stripe Checkout Session is created for it. The response carries the Stripe
        hosted-payment URL that the client must redirect the browser to.

        The request body is **polymorphic**, discriminated by `type`:

        - `"pickup"` — `PickupOrderForm`, with an `eta` timestamp.
        - `"delivery"` — `DeliveryOrderForm`, with the delivery address.

        An unrecognised or missing `type` is a Jackson deserialization failure and surfaces
        as 400.

        Contract caveats:

        - `orderNumber` is a field on the body *and* `orderSessionId` is a path variable.
          Which one wins, and whether they must agree, is not enforced by the handler.
        - The form's `type` is not checked against the `orderType` the session was created
          with, so a `PICK_UP` session can be completed with a `delivery` form.
        - `successUrl` is the name of the response field, but the value is the Stripe
          Checkout URL to redirect to — not the post-payment success URL.
        - No ownership check: any caller who knows the `orderSessionId` UUID can overwrite
          its contact details and start a payment.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: orderSessionId
          in: path
          required: true
          description: The order session to check out.
          schema:
            type: string
            format: uuid
          example: 4f1a9c2e-8b3d-4a77-9c11-2e6f7d8a9b01
        - $ref: '#/components/parameters/GuestIdCookieRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderFormRequest'
            examples:
              pickup:
                summary: Pickup order
                value:
                  type: pickup
                  orderNumber: 4f1a9c2e-8b3d-4a77-9c11-2e6f7d8a9b01
                  firstName: Casey
                  lastName: Nguyen
                  eta: '2026-08-23T19:15:00Z'
                  email: casey.nguyen@example.com
                  phoneNum: '+15125550137'
              delivery:
                summary: Delivery order
                value:
                  type: delivery
                  orderNumber: 4f1a9c2e-8b3d-4a77-9c11-2e6f7d8a9b01
                  firstName: Casey
                  lastName: Nguyen
                  streetAddr: 1200 Congress Ave
                  streetAddrDetail: Apt 4B
                  zipCode: '78701'
                  cityState: Austin, TX
                  email: casey.nguyen@example.com
                  phoneNum: '+15125550137'
      responses:
        '201':
          description: Stripe Checkout Session created. Redirect the browser to `successUrl`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
              examples:
                default:
                  value:
                    successUrl: https://checkout.stripe.com/c/pay/cs_test_a1B2c3D4e5F6g7H8i9J0kLmNoPqRsTuVwXyZ
        '400':
          description: |
            Unknown or missing `type` discriminator, malformed JSON, `email` failing `@Email`,
            missing `guestId` cookie, or `orderSessionId` not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The order session does not exist or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expired:
                  value:
                    message: Order session has been expired
                    status: 404
                    timestamp: '2026-08-23T14:09:51.667'
        '500':
          description: The Stripe API call failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/checkout/webhook:
    post:
      operationId: handleStripeWebhook
      tags: [Checkout]
      summary: Stripe webhook receiver
      description: |
        **Called by Stripe, not by clients.**

        Verifies the `Stripe-Signature` header against `stripe.webhook.secret`, then handles
        `checkout.session.completed` (converts the order session into a persisted order) and
        `payment_intent.succeeded` (records payment and card details).
        `payment_method.attached` is accepted and ignored; any other event type is logged and
        ignored.

        The request body is Stripe's raw event JSON and is read from the input stream rather
        than bound to a DTO, so signature verification sees the exact bytes.

        Responses are written directly onto `HttpServletResponse` and the body is always the
        empty string, served as `text/plain` — including on failure. Stripe only inspects the
        status code.

        Two defects worth noting:

        - If `stripe.webhook.secret` is unset, verification is skipped, `event` stays `null`,
          and the next line dereferences it — a 500 (`NullPointerException`) instead of a
          rejected request.
        - The deserialized object is cast to `Session` unconditionally before the `switch`,
          so any event whose payload is not a Checkout Session (including
          `payment_intent.succeeded` and `payment_method.attached`) throws
          `ClassCastException` and returns 500. Stripe will keep retrying those events.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: Stripe's HMAC signature over the raw request body.
          schema:
            type: string
          example: t=1755900000,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
      requestBody:
        required: true
        description: Raw Stripe event payload. Read as bytes; not validated against a schema.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeEvent'
            examples:
              checkoutSessionCompleted:
                value:
                  id: evt_1P2Q3R4S5T6U7V8W
                  object: event
                  type: checkout.session.completed
                  created: 1755900000
                  data:
                    object:
                      id: cs_test_a1B2c3D4e5F6g7H8i9J0kLmNoPqRsTuVwXyZ
                      object: checkout.session
                      payment_status: paid
                      amount_total: 1556
      responses:
        '200':
          description: Event accepted (or intentionally ignored). Empty body.
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: ''
        '400':
          description: |
            Signature verification failed (`SignatureVerificationException`). Empty body.
            Also returned by Spring if the `Stripe-Signature` header is absent.
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: ''
        '500':
          description: |
            `NullPointerException` when the webhook secret is unconfigured, or
            `ClassCastException` for a non-Checkout-Session payload. Note this response is
            JSON (rendered by `GlobalExceptionHandler`) while the success responses are
            `text/plain`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# =============================================================================
# Components
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from `POST /api/v1/login`, sent as `Authorization: Bearer <token>`.

        Validated by `JwtFilter`. The subject is the user's email; the filter reloads the
        user from the database on every request, so roles reflect current state rather than
        the token. Lifetime is 30 minutes and the signing key is regenerated on every
        application restart.

  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      description: Store identifier.
      schema:
        type: integer
        format: int64
      example: 1

    StoreProductId:
      name: storeProductId
      in: path
      required: true
      description: |
        Store product identifier — the id of the store↔product link, not the catalog
        `productId`. Must belong to `storeId`.
      schema:
        type: integer
        format: int64
      example: 3001

    ProductId:
      name: productId
      in: path
      required: true
      description: Catalog product identifier.
      schema:
        type: integer
        format: int64
      example: 101

    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Category identifier.
      schema:
        type: integer
        format: int64
      example: 1

    CartIdx:
      name: cartIdx
      in: path
      required: true
      description: |
        Zero-based position of the line item within the cart. **Not a stable identifier** —
        it shifts whenever an earlier item is added or removed.
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 0

    OrderNumber:
      name: orderNumber
      in: path
      required: true
      description: Public order identifier (UUID), distinct from the numeric `id`.
      schema:
        type: string
        format: uuid
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7

    OrderSessionIdPath:
      name: sessionId
      in: path
      required: true
      description: Order session identifier.
      schema:
        type: string
        format: uuid
      example: 4f1a9c2e-8b3d-4a77-9c11-2e6f7d8a9b01

    GuestIdCookieRequired:
      name: guestId
      in: cookie
      required: true
      description: |
        Guest correlation id, issued automatically by `GuestFilter` on the first response.
        **Required even for authenticated callers** on this operation — omitting it is a 400.
      schema:
        type: string
        format: uuid
      example: 9d5b1f30-6c4a-4f2e-8b77-0a1c2d3e4f50

    GuestIdCookieOptional:
      name: guestId
      in: cookie
      required: false
      description: |
        Guest correlation id. Optional at the binding level, but a request with neither a
        bearer token nor this cookie is rejected with 400
        (`Guest ID or authenticated user is required`).
      schema:
        type: string
        format: uuid
      example: 9d5b1f30-6c4a-4f2e-8b77-0a1c2d3e4f50

  responses:
    FilterChainUnauthorized:
      description: |
        No token, or the token is malformed, expired or signed with a stale key. Produced by
        `CustomAuthenticationEntryPoint`, which replaces the specific reason with a generic
        message — clients cannot distinguish "expired" from "invalid".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: Authentication failed
                status: 401
                timestamp: '2026-08-23T14:12:00.115'

    Forbidden:
      description: |
        Authenticated but lacking the required role. There is no `@ExceptionHandler` for
        `AccessDeniedException`, so this is Spring Security's default 403 and the body shape
        is **not** `ErrorResponse`.
      content:
        application/json:
          schema:
            type: object
            description: Spring Boot's default error body.
            properties:
              timestamp:
                type: string
              status:
                type: integer
              error:
                type: string
              path:
                type: string
          examples:
            default:
              value:
                timestamp: '2026-08-23T14:12:00.115+00:00'
                status: 403
                error: Forbidden
                path: /api/v1/products

    MissingGuestIdCookie:
      description: |
        The `guestId` cookie is absent. Typically the very first request from a fresh client,
        because `GuestFilter` sets the cookie on the response *after* the handler has already
        rejected the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: Required cookie 'guestId' for method parameter type UUID is not present
                status: 400
                timestamp: '2026-08-23T14:12:00.115'

    StoreNotFound:
      description: No store with that id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: Store with ID[99] not found
                status: 404
                timestamp: '2026-08-23T14:12:00.115'

    PathVariableTypeMismatch:
      description: A path variable could not be converted to the expected type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # -------------------------------------------------------------------------
    # Common
    # -------------------------------------------------------------------------
    ErrorResponse:
      type: object
      title: ErrorResponse
      description: |
        Uniform error body produced by `GlobalExceptionHandler` and
        `CustomAuthenticationEntryPoint`. There is no error code or field-level detail, so
        clients cannot branch on anything but the HTTP status and the human-readable message.
      required: [message, status, timestamp]
      properties:
        message:
          type: [string, 'null']
          description: |
            Human-readable message. Can be `null` when the underlying exception carried no
            message (for example a bare `IllegalStateException`). Not stable — treat as
            display/debug text only.
          examples: ['Store with ID[99] not found']
        status:
          type: integer
          format: int32
          description: Duplicates the HTTP status code.
          examples: [404]
        timestamp:
          type: string
          description: |
            `LocalDateTime.now().toString()` — server-local time with **no timezone offset**,
            unlike the `Instant` fields elsewhere in the API, which are UTC with a `Z` suffix.
          examples: ['2026-08-23T14:12:00.115']

    # -------------------------------------------------------------------------
    # Enums
    # -------------------------------------------------------------------------
    ProductType:
      type: string
      title: ProductType
      description: Whether the product is a standalone item or a combo meal.
      enum: [ONLY, MEAL]

    QuantityType:
      type: string
      title: QuantityType
      description: |
        Quantity variant of an option. Mixes two unrelated axes — portion size
        (`Kids`…`Large`) and intensity (`Easy`, `Regular`, `Extra`) — and, unlike every other
        enum in the API, uses PascalCase rather than SCREAMING_SNAKE_CASE.
      enum: [Kids, Small, Medium, Large, Easy, Regular, Extra]

    CountType:
      type: string
      title: CountType
      description: |
        How an option's amount is expressed. `COUNTABLE` uses `optionQuantity`,
        `UNCOUNTABLE` uses a `quantityDetail` selection, `NONE` is a plain toggle.
      enum: [COUNTABLE, UNCOUNTABLE, NONE]

    CustomRuleType:
      type: string
      title: CustomRuleType
      description: |
        Selection semantics of a custom rule. `UNIQUE` = pick exactly one, `LIMIT` = bounded
        by `minSelection`/`maxSelection`, `FREE` = unconstrained.
      enum: [UNIQUE, LIMIT, FREE]

    OptionTraitType:
      type: string
      title: OptionTraitType
      description: 'Trait value domain. Only `BINARY` exists, where `selectedValue`/`currentValue` is 0 or 1.'
      enum: [BINARY]

    ModifyType:
      type: string
      title: ModifyType
      description: |
        Delta operation applied by the store-product override endpoint. `HIDE` makes an
        option non-selectable at the store without deleting it.
      enum: [ADD, DELETE, OVERRIDE, HIDE]

    OrderType:
      type: string
      title: OrderType
      description: |
        Fulfilment method. `DINE_IN` is defined but no order form maps to it — the checkout
        body only supports `pickup` and `delivery`.
      enum: [PICK_UP, DELIVERY, DINE_IN]

    OrderStatus:
      type: string
      title: OrderStatus
      enum:
        - PENDING
        - CONFIRMING
        - PREPARING
        - PICKUP_READY
        - DELIVERY_READY
        - DELIVERING
        - COMPLETED
        - CANCELLED
        - EXPIRED

    PaymentStatus:
      type: string
      title: PaymentStatus
      description: '`PENDING` and `UNPAID` overlap; the distinction is not documented in the code.'
      enum: [PENDING, PAID, UNPAID, FAILED, REFUNDED]

    PaymentMethod:
      type: string
      title: PaymentMethod
      description: 'Only `CREDIT_CARD` is reachable today — payment goes through Stripe Checkout.'
      enum: [CASH, CREDIT_CARD, PAYPAL, GIFT_CARD]

    DiscountType:
      type: string
      title: DiscountType
      enum: [FIXED, PERCENTAGE]

    Role:
      type: string
      title: Role
      description: |
        Account role. Authorities are hierarchical and expanded at authentication time:
        `USER` → `ROLE_USER`; `EMPLOYER` → `ROLE_EMPLOYER, ROLE_USER`;
        `ADMIN` → `ROLE_ADMIN, ROLE_EMPLOYER, ROLE_USER`. Sign-up always creates `USER`;
        there is no API for changing a role.
      enum: [USER, EMPLOYER, ADMIN]

    OrderSortType:
      type: string
      title: OrderSortType
      description: Sort orders for the order-history listing.
      enum: [CREATED_AT_DESC, CREATED_AT_ASC, TOTAL_PRICE_DESC]
      default: CREATED_AT_DESC

    # -------------------------------------------------------------------------
    # Auth / user
    # -------------------------------------------------------------------------
    LoginRequest:
      type: object
      title: LoginRequest
      description: |
        Credentials. Only `email` carries a constraint (`@Email`), and because the handler
        does not use `@Valid` even that is **not enforced**.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          examples: [burger.lover@example.com]
        password:
          type: string
          format: password
          description: Write-only (`@JsonProperty(access = WRITE_ONLY)`); never serialized back.
          writeOnly: true

    LoginResponse:
      type: object
      title: LoginResponse
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
          description: 'JWT for the `Authorization: Bearer` header. Valid 30 minutes.'
        refreshToken:
          type: string
          description: |
            JWT valid 7 days. **Currently unusable** — no endpoint accepts it. Structurally
            identical to the access token, so it would also be accepted as a bearer token.

    UserCreateRequest:
      type: object
      title: UserCreateRequest
      description: |
        Sign-up payload. No field is validated: there are no Bean Validation annotations and
        the handler does not use `@Valid`, so blanks and malformed emails/phone numbers are
        persisted as given. The role is always `USER`.
      required: [email, password]
      properties:
        firstName:
          type: [string, 'null']
          examples: [Casey]
        lastName:
          type: [string, 'null']
          examples: [Nguyen]
        phoneNum:
          type: [string, 'null']
          description: Free-form. No format enforced.
          examples: ['+15125550137']
        zipCode:
          type: [string, 'null']
          description: 'Note the casing: `zipCode` on the way in, `zipcode` on the way out in `UserReadResponse`.'
          examples: ['78701']
        email:
          type: string
          format: email
          examples: [casey.nguyen@example.com]
        password:
          type: string
          format: password
          description: Stored BCrypt-hashed. No strength or length requirement is enforced.
          writeOnly: true

    UserCreateResponse:
      type: object
      title: UserCreateResponse
      required: [userId]
      properties:
        userId:
          type: integer
          format: int64
          examples: [42]

    UserReadResponse:
      type: object
      title: UserReadResponse
      properties:
        userId:
          type: integer
          format: int64
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        phoneNum:
          type: [string, 'null']
        email:
          type: string
          format: email
        zipcode:
          type: [string, 'null']
          description: Lowercase `zipcode` here, versus `zipCode` in `UserCreateRequest`.
        role:
          $ref: '#/components/schemas/Role'

    # -------------------------------------------------------------------------
    # Catalog
    # -------------------------------------------------------------------------
    CategoryReadResponse:
      type: object
      title: CategoryReadResponse
      properties:
        categoryId:
          type: integer
          format: int64
        name:
          type: string
          examples: [Burgers]
        productCount:
          type: [integer, 'null']
          format: int32
          description: Number of products in the category, counted across the whole catalog rather than per store.

    OptionQuantity:
      type: object
      title: OptionQuantity
      properties:
        id:
          type: integer
          format: int64
          description: Option-quantity id. This is the value a cart request sends as `quantityDetailRequest.id`.
        quantityType:
          $ref: '#/components/schemas/QuantityType'

    OptionReadResponse:
      type: object
      title: OptionReadResponse
      properties:
        optionId:
          type: integer
          format: int64
        optionName:
          type: string
          examples: [Bacon]
        imageSource:
          type: [string, 'null']
          description: |
            Fully qualified URL (`aws.s3.public-url` + key), or `null` when the option has no
            image. Other endpoints return a bare object key in the same-named field.
        optionCalories:
          type: [number, 'null']
          format: double
        quantityDetails:
          type: array
          items:
            $ref: '#/components/schemas/OptionQuantity'

    OptionTraitReadResponse:
      type: object
      title: OptionTraitReadResponse
      properties:
        optionTraitId:
          type: integer
          format: int64
        name:
          type: string
          examples: [Grilled]
        labelCode:
          type: [string, 'null']
          description: Stable key for client-side i18n of the display label.
          examples: [GRILLED]
        optionTraitType:
          $ref: '#/components/schemas/OptionTraitType'

    ProductReadResponse:
      type: object
      title: ProductReadResponse
      description: Catalog product summary. Identifier field is `productId`.
      properties:
        productId:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: [number, 'null']
          format: double
          description: Catalog list price. A store may override it.
        calories:
          type: [number, 'null']
          format: double
        briefInfo:
          type: [string, 'null']
        imageSource:
          type: [string, 'null']
          description: Raw S3 object key, not a URL.
        productType:
          $ref: '#/components/schemas/ProductType'

    ProductReadByCategoryIdResponse:
      type: object
      title: ProductReadByCategoryIdResponse
      description: |
        Catalog product summary as returned by the by-category endpoint. Differs from
        `ProductReadResponse`: the identifier is `id`, and `productType` is absent.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: [number, 'null']
          format: double
        calories:
          type: [number, 'null']
          format: double
        imageSource:
          type: [string, 'null']
        briefInfo:
          type: [string, 'null']

    ProductOptionCustomRule:
      type: object
      title: ProductOptionCustomRule
      description: |
        The custom rule an option belongs to, embedded on every option. Clients group options
        by `customRuleId` to reconstruct the rule-by-rule configurator.
      properties:
        customRuleId:
          type: integer
          format: int64
        name:
          type: string
          examples: [Add Extras]
        customRuleType:
          $ref: '#/components/schemas/CustomRuleType'
        orderIndex:
          type: [integer, 'null']
          format: int32
        minSelection:
          type: [integer, 'null']
          format: int32
        maxSelection:
          type: [integer, 'null']
          format: int32

    ProductOptionQuantityDetail:
      type: object
      title: ProductOptionQuantityDetail
      properties:
        id:
          type: integer
          format: int64
          description: '`ProductOptionOptionQuantity` id — send this as `quantityDetailRequest.id` when adding to the cart.'
        quantityType:
          $ref: '#/components/schemas/QuantityType'
        labelCode:
          type: [string, 'null']
        extraPrice:
          type: [number, 'null']
          format: double
        extraCalories:
          type: [number, 'null']
          format: double
        isDefault:
          type: [boolean, 'null']

    ProductOptionTraitDetail:
      type: object
      title: ProductOptionTraitDetail
      properties:
        productOptionTraitId:
          type: integer
          format: int64
        name:
          type: string
        labelCode:
          type: [string, 'null']
        optionTraitType:
          $ref: '#/components/schemas/OptionTraitType'
        defaultSelection:
          type: [integer, 'null']
          format: int32
        extraPrice:
          type: [number, 'null']
          format: double
        extraCalories:
          type: [number, 'null']
          format: double

    ProductOptionDetail:
      type: object
      title: ProductOptionDetail
      description: One selectable option on a product, with its parent rule embedded.
      properties:
        productOptionId:
          type: integer
          format: int64
          description: Identifies the product↔option pairing. This is what cart requests reference.
        name:
          type: string
        isDefault:
          type: [boolean, 'null']
        defaultQuantity:
          type: [integer, 'null']
          format: int32
        maxQuantity:
          type: [integer, 'null']
          format: int32
        extraPrice:
          type: [number, 'null']
          format: double
        calories:
          type: [number, 'null']
          format: double
        countType:
          $ref: '#/components/schemas/CountType'
        imageSource:
          type: [string, 'null']
          description: Raw S3 object key.
        orderIndex:
          type: [integer, 'null']
          format: int32
        customRuleResponse:
          $ref: '#/components/schemas/ProductOptionCustomRule'
        quantityDetailResponses:
          type: array
          items:
            $ref: '#/components/schemas/ProductOptionQuantityDetail'
        optionTraitResponses:
          type: array
          items:
            $ref: '#/components/schemas/ProductOptionTraitDetail'

    ProductReadByProductId:
      type: object
      title: ProductReadByProductId
      description: Catalog product with its full option tree.
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        productPrice:
          type: [number, 'null']
          format: double
        productCalories:
          type: 'null'
          description: |
            **Always `null`.** `ProductReadByProductIdDto.toDto` never sets this field even
            though the product entity has a calorie value.
        imageSource:
          type: [string, 'null']
        briefInfo:
          type: [string, 'null']
        optionResponses:
          type: array
          items:
            $ref: '#/components/schemas/ProductOptionDetail'

    StoreProductReadByProductId:
      type: object
      title: StoreProductReadByProductId
      description: |
        Store-specific product with its full option tree — the same shape as
        `ProductReadByProductId` except the identifier is `storeProductId`, and prices and
        option availability reflect the store's overrides.
      properties:
        storeProductId:
          type: integer
          format: int64
        productName:
          type: string
        productPrice:
          type: [number, 'null']
          format: double
          description: Store price, after any override.
        productCalories:
          type: [number, 'null']
          format: double
        imageSource:
          type: [string, 'null']
        briefInfo:
          type: [string, 'null']
        optionResponses:
          type: array
          items:
            $ref: '#/components/schemas/ProductOptionDetail'

    ProductCreateRequest:
      type: object
      title: ProductCreateRequest
      description: |
        Full product definition sent as the `productBlob` multipart part. Creates the
        product, its category assignments, its custom rules, and the options and traits under
        each rule, in one shot. No field is validated.
      properties:
        productName:
          type: string
        productPrice:
          type: number
          format: double
        productCalories:
          type: [number, 'null']
          format: double
        productType:
          $ref: '#/components/schemas/ProductType'
        briefInfo:
          type: [string, 'null']
        categoryIds:
          type: array
          description: Categories to assign the product to. Every id must already exist.
          items:
            type: integer
            format: int64
        customRuleRequests:
          type: array
          items:
            $ref: '#/components/schemas/ProductCreateCustomRuleRequest'

    ProductCreateCustomRuleRequest:
      type: object
      title: ProductCreateCustomRuleRequest
      properties:
        customRuleName:
          type: string
        customRuleType:
          $ref: '#/components/schemas/CustomRuleType'
        orderIndex:
          type: [integer, 'null']
          format: int32
        minSelection:
          type: [integer, 'null']
          format: int32
        maxSelection:
          type: [integer, 'null']
          format: int32
          description: Consistency with `customRuleType` and `minSelection` is not validated server-side.
        optionRequests:
          type: array
          items:
            $ref: '#/components/schemas/ProductCreateOptionRequest'

    ProductCreateOptionRequest:
      type: object
      title: ProductCreateOptionRequest
      properties:
        optionId:
          type: integer
          format: int64
          description: References an existing option from `GET /api/v1/options`.
        isDefault:
          type: [boolean, 'null']
        countType:
          $ref: '#/components/schemas/CountType'
        defaultQuantity:
          type: [integer, 'null']
          format: int32
        maxQuantity:
          type: [integer, 'null']
          format: int32
        extraPrice:
          type: [number, 'null']
          format: double
        orderIndex:
          type: [integer, 'null']
          format: int32
        quantityDetails:
          type: array
          items:
            $ref: '#/components/schemas/ProductCreateQuantityRequest'
        optionTraitRequests:
          type: array
          items:
            $ref: '#/components/schemas/ProductCreateOptionTraitRequest'

    ProductCreateQuantityRequest:
      type: object
      title: ProductCreateQuantityRequest
      properties:
        id:
          type: integer
          format: int64
          description: Existing option-quantity id, from `OptionReadResponse.quantityDetails[].id`.
        quantityType:
          $ref: '#/components/schemas/QuantityType'
        isDefault:
          type: [boolean, 'null']
        extraPrice:
          type: [number, 'null']
          format: double

    ProductCreateOptionTraitRequest:
      type: object
      title: ProductCreateOptionTraitRequest
      properties:
        optionTraitId:
          type: integer
          format: int64
        defaultSelection:
          type: [integer, 'null']
          format: int32
        extraPrice:
          type: [number, 'null']
          format: double
        extraCalories:
          type: [number, 'null']
          format: double

    # -------------------------------------------------------------------------
    # Store
    # -------------------------------------------------------------------------
    StoreAddress:
      type: object
      title: StoreAddress
      properties:
        city:
          type: [string, 'null']
        street:
          type: [string, 'null']
        state:
          type: [string, 'null']
        zipcode:
          type: [string, 'null']

    StoreCoordinate:
      type: object
      title: StoreCoordinate
      properties:
        longitude:
          type: [number, 'null']
          format: double
        latitude:
          type: [number, 'null']
          format: double

    StoreResponse:
      type: object
      title: StoreResponse
      description: |
        A store. **Population depends on the endpoint.** `GET /api/v1/store` fills only
        `storeId`, `overpassId` and `houseNumber`; the copy embedded in
        `OrderDetailResponse.storeResponse` is fully populated.
      properties:
        storeId:
          type: integer
          format: int64
        overpassId:
          type: [integer, 'null']
          format: int64
          description: OpenStreetMap/Overpass identifier the store record was imported from.
        houseNumber:
          type: [integer, 'null']
          format: int64
        openTime:
          type: [string, 'null']
          description: Local opening time, `HH:mm:ss`. No timezone is carried.
          examples: ['07:00:00']
        closeTime:
          type: [string, 'null']
          description: Local closing time, `HH:mm:ss`.
          examples: ['23:00:00']
        branch:
          type: [string, 'null']
        address:
          anyOf:
            - $ref: '#/components/schemas/StoreAddress'
            - type: 'null'
        coordinate:
          anyOf:
            - $ref: '#/components/schemas/StoreCoordinate'
            - type: 'null'
        phoneNum:
          type: [string, 'null']
        website:
          type: [string, 'null']

    NearByStoreReadResponse:
      type: object
      title: NearByStoreReadResponse
      description: |
        A store with routing metrics. `openTime`, `closeTime`, `website` and `overpassId` are
        not populated by the controller's mapper and are always `null`.
      properties:
        storeId:
          type: integer
          format: int64
        overpassId:
          type: [integer, 'null']
          format: int64
        houseNumber:
          type: [integer, 'null']
          format: int64
        openTime:
          type: 'null'
          description: Always `null` on this endpoint.
        closeTime:
          type: 'null'
          description: Always `null` on this endpoint.
        branch:
          type: [string, 'null']
        address:
          anyOf:
            - $ref: '#/components/schemas/StoreAddress'
            - type: 'null'
        coordinate:
          anyOf:
            - $ref: '#/components/schemas/StoreCoordinate'
            - type: 'null'
        phoneNum:
          type: [string, 'null']
        website:
          type: 'null'
          description: Always `null` on this endpoint.
        distance:
          type: [number, 'null']
          format: double
          description: Routing distance in meters (not straight-line).
        duration:
          type: [number, 'null']
          format: double
          description: Routing duration in seconds.

    StoreProductCreateRequest:
      type: object
      title: StoreProductCreateRequest
      properties:
        storeIds:
          type: array
          description: Stores to register the product to. Not deduplicated or validated for emptiness.
          items:
            type: integer
            format: int64
        productId:
          type: integer
          format: int64

    CategorizedStoreProductsRead:
      type: object
      title: CategorizedStoreProductsRead
      properties:
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        orderIndex:
          type: [integer, 'null']
          format: int32
          description: Display order of the category within the store's menu.
        products:
          type: array
          items:
            $ref: '#/components/schemas/CategorizedStoreProduct'

    CategorizedStoreProduct:
      type: object
      title: CategorizedStoreProduct
      properties:
        storeProductId:
          type: integer
          format: int64
          description: Use this id for the cart and for the product-detail endpoint.
        name:
          type: string
        price:
          type: [number, 'null']
          format: double
          description: Store price.
        calories:
          type: [number, 'null']
          format: double
        briefInfo:
          type: [string, 'null']
        imageSource:
          type: [string, 'null']
        productType:
          $ref: '#/components/schemas/ProductType'

    StoreProductsRead:
      type: object
      title: StoreProductsRead
      description: |
        Flat store menu entry. **`productId` actually holds the store-product id**, matching
        `CategorizedStoreProduct.storeProductId`; the field name is misleading.
      properties:
        productId:
          type: integer
          format: int64
          description: Store-product id, despite the name.
        name:
          type: string
        price:
          type: [number, 'null']
          format: double
        calories:
          type: [number, 'null']
          format: double
        briefInfo:
          type: [string, 'null']
        imageSource:
          type: [string, 'null']
        productType:
          $ref: '#/components/schemas/ProductType'
        categories:
          type: array
          description: Every category the product appears in, with its ordering inside each.
          items:
            $ref: '#/components/schemas/StoreProductCategory'

    StoreProductCategory:
      type: object
      title: StoreProductCategory
      properties:
        categoryId:
          type: integer
          format: int64
        orderIndex:
          type: integer
          format: int32

    StoreProductModifyRequest:
      type: object
      title: StoreProductModifyRequest
      description: Store-level override delta for a store product.
      properties:
        productPrice:
          type: [number, 'null']
          format: double
          description: New store price. Semantics when omitted/`null` are not defined in code.
        customRuleRequests:
          type: array
          items:
            $ref: '#/components/schemas/StoreCustomRuleModifyRequest'

    StoreCustomRuleModifyRequest:
      type: object
      title: StoreCustomRuleModifyRequest
      properties:
        customRuleId:
          type: integer
          format: int64
        modifyType:
          $ref: '#/components/schemas/ModifyType'
        optionRequests:
          type: array
          items:
            $ref: '#/components/schemas/StoreOptionModifyRequest'

    StoreOptionModifyRequest:
      type: object
      title: StoreOptionModifyRequest
      description: |
        Which of these fields are read depends on `modifyType`; the mapping is implicit in
        `StoreProductService` and not enforced by the schema. For `HIDE` and `DELETE`, only
        `productOptionId` is meaningful.
      properties:
        productOptionId:
          type: integer
          format: int64
        isDefault:
          type: [boolean, 'null']
        defaultQuantity:
          type: [integer, 'null']
          format: int32
        maxQuantity:
          type: [integer, 'null']
          format: int32
        extraPrice:
          type: [number, 'null']
          format: double
        orderIndex:
          type: [integer, 'null']
          format: int32
        modifyType:
          $ref: '#/components/schemas/ModifyType'
        quantityRequest:
          type: array
          description: 'Singular field name for an array; the sibling field is `optionTraitRequests` (plural).'
          items:
            $ref: '#/components/schemas/StoreQuantityModifyRequest'
        optionTraitRequests:
          type: array
          items:
            $ref: '#/components/schemas/StoreTraitModifyRequest'

    StoreQuantityModifyRequest:
      type: object
      title: StoreQuantityModifyRequest
      description: Has no `modifyType` of its own, unlike its sibling request types.
      properties:
        productOptionOptionQuantityId:
          type: integer
          format: int64
        quantityType:
          $ref: '#/components/schemas/QuantityType'
        isDefault:
          type: [boolean, 'null']
        extraPrice:
          type: [number, 'null']
          format: double

    StoreTraitModifyRequest:
      type: object
      title: StoreTraitModifyRequest
      properties:
        productOptionTraitId:
          type: integer
          format: int64
        defaultSelection:
          type: [integer, 'null']
          format: int32
        extraPrice:
          type: [number, 'null']
          format: double
        modifyType:
          $ref: '#/components/schemas/ModifyType'

    # -------------------------------------------------------------------------
    # Cart — requests
    # -------------------------------------------------------------------------
    CartCreateRequest:
      type: object
      title: CartCreateRequest
      description: |
        A configured product to append to the cart. `customRuleRequests` must describe the
        complete selection; the server validates it against the store product's rules and
        stock before pricing.
      properties:
        storeProductId:
          type: integer
          format: int64
          description: From the store menu endpoints. Must belong to the `storeId` in the path.
        quantity:
          type: [integer, 'null']
          format: int32
          description: Number of this configured item. Not validated — `0` and negatives are accepted by binding.
        customRuleRequests:
          type: array
          items:
            $ref: '#/components/schemas/CartCustomRuleRequest'

    CartOptionModifyRequest:
      type: object
      title: CartOptionModifyRequest
      description: |
        Full replacement of a line item's option selection. Anything omitted counts as
        deselected.
      properties:
        customRuleRequests:
          type: array
          items:
            $ref: '#/components/schemas/CartCustomRuleRequest'

    CartProductModifyRequest:
      type: object
      title: CartProductModifyRequest
      properties:
        storeId:
          type: [integer, 'null']
          format: int64
          description: '**Ignored.** The handler uses the path variable. Present in the DTO only.'
        quantity:
          type: integer
          format: int32
          description: |
            New absolute quantity. Primitive `int` with no validation, so `0` and negatives
            bind successfully. Omitting it defaults to `0`.

    CartCustomRuleRequest:
      type: object
      title: CartCustomRuleRequest
      properties:
        customRuleId:
          type: integer
          format: int64
        optionRequests:
          type: array
          items:
            $ref: '#/components/schemas/CartOptionRequest'

    CartOptionRequest:
      type: object
      title: CartOptionRequest
      description: |
        One option selection. Which fields matter depends on the option's `countType`:
        `COUNTABLE` uses `optionQuantity`, `UNCOUNTABLE` uses `quantityDetailRequest`, `NONE`
        uses only `isSelected`. Violations raise `InvalidOptionRequestException` (400).
      properties:
        productOptionId:
          type: integer
          format: int64
        optionQuantity:
          type: [integer, 'null']
          format: int32
          description: 'Count for `COUNTABLE` options. Must not exceed the option''s `maxQuantity`.'
        isSelected:
          type: [boolean, 'null']
          description: Whether the option is selected. Selecting an option hidden at this store is a 400.
        optionTraitRequests:
          type: array
          items:
            $ref: '#/components/schemas/CartOptionTraitRequest'
        quantityDetailRequest:
          anyOf:
            - $ref: '#/components/schemas/CartQuantityDetailRequest'
            - type: 'null'
          description: 'Size/intensity choice for `UNCOUNTABLE` options.'

    CartOptionTraitRequest:
      type: object
      title: CartOptionTraitRequest
      properties:
        productOptionTraitId:
          type: integer
          format: int64
        currentValue:
          type: [integer, 'null']
          format: int32
          description: 'For `BINARY` traits: `0` (off) or `1` (on). Other values are not rejected by the schema.'

    CartQuantityDetailRequest:
      type: object
      title: CartQuantityDetailRequest
      properties:
        id:
          type: integer
          format: int64
          description: The chosen `ProductOptionOptionQuantity` id, from `quantityDetailResponses[].id`.

    # -------------------------------------------------------------------------
    # Cart — responses
    # -------------------------------------------------------------------------
    CartResponse:
      type: object
      title: CartResponse
      description: |
        The whole cart. Returned by every cart operation except `POST`, which returns only
        the created line item. Prices are recomputed on each read.
      properties:
        productResponses:
          type: array
          description: Line items in cart order. The array index is the `cartIdx` used by the item-level operations.
          items:
            $ref: '#/components/schemas/CartProductResponse'
        cartTotalPrice:
          type: [number, 'null']
          format: double

    CartProductResponse:
      type: object
      title: CartProductResponse
      description: |
        One priced line item. Carries no identifier of its own — it is addressed by its
        position in `CartResponse.productResponses`.
      properties:
        storeProductId:
          type: integer
          format: int64
        productName:
          type: string
        productType:
          $ref: '#/components/schemas/ProductType'
        basePrice:
          type: [number, 'null']
          format: double
          description: Store price of one unit before options.
        imageSource:
          type: [string, 'null']
        briefInfo:
          type: [string, 'null']
        calories:
          type: [number, 'null']
          format: double
          description: Calories per unit including the selected options.
        customRuleResponses:
          type: array
          items:
            $ref: '#/components/schemas/CartCustomRuleResponse'
        quantity:
          type: [integer, 'null']
          format: int32
        productExtraPrice:
          type: [number, 'null']
          format: double
          description: Options surcharge for one unit.
        productTotalPrice:
          type: [number, 'null']
          format: double
          description: '`(basePrice + productExtraPrice) * quantity`.'

    CartCustomRuleResponse:
      type: object
      title: CartCustomRuleResponse
      description: |
        A custom rule with its options and the caller's current selection state — enough to
        re-render the configurator for editing.
      properties:
        customRuleId:
          type: integer
          format: int64
        customRuleName:
          type: string
        orderIndex:
          type: [integer, 'null']
          format: int32
        customRuleType:
          $ref: '#/components/schemas/CustomRuleType'
        minSelection:
          type: [integer, 'null']
          format: int32
        maxSelection:
          type: [integer, 'null']
          format: int32
        customRuleTotalPrice:
          type: [number, 'null']
          format: double
        optionResponses:
          type: array
          items:
            $ref: '#/components/schemas/CartOptionResponse'

    CartOptionResponse:
      type: object
      title: CartOptionResponse
      properties:
        productOptionId:
          type: integer
          format: int64
        optionName:
          type: string
        isDefault:
          type: [boolean, 'null']
        defaultQuantity:
          type: [integer, 'null']
          format: int32
        optionQuantity:
          type: [integer, 'null']
          format: int32
          description: Currently selected count.
        maxQuantity:
          type: [integer, 'null']
          format: int32
        basePrice:
          type: [number, 'null']
          format: double
        baseCalories:
          type: [number, 'null']
          format: double
        imageSource:
          type: [string, 'null']
        isSelected:
          type: [boolean, 'null']
        countType:
          $ref: '#/components/schemas/CountType'
        orderIndex:
          type: [integer, 'null']
          format: int32
        optionTotalPrice:
          type: [number, 'null']
          format: double
        optionTraitResponses:
          type: array
          items:
            $ref: '#/components/schemas/CartOptionTraitResponse'
        quantityDetailResponse:
          anyOf:
            - $ref: '#/components/schemas/CartQuantityDetailResponse'
            - type: 'null'

    CartOptionTraitResponse:
      type: object
      title: CartOptionTraitResponse
      properties:
        productOptionTraitId:
          type: integer
          format: int64
        currentValue:
          type: [integer, 'null']
          format: int32
        labelCode:
          type: [string, 'null']
        optionTraitName:
          type: string
        optionTraitType:
          $ref: '#/components/schemas/OptionTraitType'
        defaultSelection:
          type: [integer, 'null']
          format: int32
        basePrice:
          type: [number, 'null']
          format: double
        baseCalories:
          type: [number, 'null']
          format: double
        traitTotalPrice:
          type: [number, 'null']
          format: double

    CartQuantityDetailResponse:
      type: object
      title: CartQuantityDetailResponse
      description: The available size/intensity choices plus which one is selected.
      properties:
        quantityDetails:
          type: array
          items:
            $ref: '#/components/schemas/CartQuantityDetail'
        selectedId:
          type: [integer, 'null']
          format: int64
          description: 'Selected `quantityId`, or `null` if nothing is selected.'

    CartQuantityDetail:
      type: object
      title: CartQuantityDetail
      properties:
        quantityId:
          type: integer
          format: int64
          description: |
            Named `quantityId` here, but `id` in `ProductOptionQuantityDetail` and
            `quantityDetailRequest.id` on the way in — the same value under three names.
        labelCode:
          type: [string, 'null']
        extraPrice:
          type: [number, 'null']
          format: double
        extraCalories:
          type: [number, 'null']
          format: double
        isDefault:
          type: [boolean, 'null']
        quantityType:
          $ref: '#/components/schemas/QuantityType'

    # -------------------------------------------------------------------------
    # Order session
    # -------------------------------------------------------------------------
    OrderSessionCreateRequest:
      type: object
      title: OrderSessionCreateRequest
      properties:
        orderType:
          $ref: '#/components/schemas/OrderType'

    GuestInfo:
      type: object
      title: GuestInfo
      properties:
        guestId:
          type: [string, 'null']
          format: uuid
          description: '`null` for orders placed by an authenticated user.'

    OrderSessionResponse:
      type: object
      title: OrderSessionResponse
      description: |
        Frozen snapshot of a cart, priced, awaiting checkout. Distinct from `OrderDetailResponse`:
        no card/contact/address block until the checkout form is submitted, and its identifier
        is `sessionId` rather than `orderNumber`.
      properties:
        sessionId:
          type: string
          format: uuid
        storeId:
          type: integer
          format: int64
        totalPrice:
          type: [number, 'null']
          format: double
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'
        orderType:
          $ref: '#/components/schemas/OrderType'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        paymentMethod:
          anyOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
          description: '`null` until payment completes.'
        orderNote:
          type: [string, 'null']
          description: No endpoint sets this on a session; always `null` in practice.
        discountType:
          anyOf:
            - $ref: '#/components/schemas/DiscountType'
            - type: 'null'
        taxAmount:
          type: [number, 'null']
          format: double
        guestInfo:
          anyOf:
            - $ref: '#/components/schemas/GuestInfo'
            - type: 'null'
        productResponses:
          type: array
          items:
            $ref: '#/components/schemas/OrderSessionProductResponse'

    OrderSessionProductResponse:
      type: object
      title: OrderSessionProductResponse
      properties:
        id:
          type: [integer, 'null']
          format: int64
          description: Position/identity within the session, not a persisted order-item id.
        storeProductId:
          type: integer
          format: int64
        quantity:
          type: [integer, 'null']
          format: int32
        name:
          type: string
        basePrice:
          type: [number, 'null']
          format: double
        extraPrice:
          type: [number, 'null']
          format: double
        totalPrice:
          type: [number, 'null']
          format: double
        imageSource:
          type: [string, 'null']
        calculatedCalories:
          type: [number, 'null']
          format: double
        productType:
          $ref: '#/components/schemas/ProductType'
        customRuleResponses:
          type: array
          items:
            $ref: '#/components/schemas/OrderSessionCustomRuleResponse'

    OrderSessionCustomRuleResponse:
      type: object
      title: OrderSessionCustomRuleResponse
      properties:
        id:
          type: [integer, 'null']
          format: int64
        customRuleId:
          type: integer
          format: int64
        name:
          type: string
        calculatedPrice:
          type: [number, 'null']
          format: double
        optionResponses:
          type: array
          items:
            $ref: '#/components/schemas/OrderSessionOptionResponse'

    OrderSessionOptionResponse:
      type: object
      title: OrderSessionOptionResponse
      description: |
        Only the *selected* options appear here, unlike the cart response, which returns every
        option with its selection state.
      properties:
        id:
          type: [integer, 'null']
          format: int64
        productOptionId:
          type: integer
          format: int64
        name:
          type: string
        countType:
          $ref: '#/components/schemas/CountType'
        basePrice:
          type: [number, 'null']
          format: double
        calculatedPrice:
          type: [number, 'null']
          format: double
        calculatedCalories:
          type: [number, 'null']
          format: double
        quantity:
          type: [integer, 'null']
          format: int32
        quantityDetail:
          anyOf:
            - $ref: '#/components/schemas/OrderQuantityDetail'
            - type: 'null'
        traitResponses:
          type: array
          items:
            $ref: '#/components/schemas/OrderTraitResponse'

    OrderQuantityDetail:
      type: object
      title: OrderQuantityDetail
      description: |
        The selected size/intensity. Carries only the chosen value, not the list of
        alternatives as the cart's `CartQuantityDetailResponse` does. It also lacks
        `labelCode`, so clients cannot localise it without a separate catalog lookup.
      properties:
        productOptionOptionQuantityId:
          type: [integer, 'null']
          format: int64
        quantityType:
          $ref: '#/components/schemas/QuantityType'
        extraPrice:
          type: [number, 'null']
          format: double
        extraCalories:
          type: [number, 'null']
          format: double

    OrderTraitResponse:
      type: object
      title: OrderTraitResponse
      properties:
        id:
          type: [integer, 'null']
          format: int64
        productOptionTraitId:
          type: integer
          format: int64
        name:
          type: string
        labelCode:
          type: [string, 'null']
        basePrice:
          type: [number, 'null']
          format: double
        calculatedPrice:
          type: [number, 'null']
          format: double
        calculatedCalories:
          type: [number, 'null']
          format: double
        optionTraitType:
          $ref: '#/components/schemas/OptionTraitType'
        selectedValue:
          type: [integer, 'null']
          format: int32

    # -------------------------------------------------------------------------
    # Order
    # -------------------------------------------------------------------------
    OrderListResponse:
      type: object
      title: OrderListResponse
      description: |
        A page of orders. Note that this is a hand-rolled envelope rather than Spring's `Page`
        shape: there is no `totalPages`, `number`, `size`, `first` or `last`, so a client must
        derive paging state from `orderCount` and the `pageSize` it requested.
      properties:
        orderCount:
          type: [integer, 'null']
          format: int64
          description: Total number of orders for the user across all pages.
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'

    OrderSummary:
      type: object
      title: OrderSummary
      properties:
        id:
          type: integer
          format: int64
          description: Internal numeric id. Use `orderNumber` for the detail endpoint.
        orderNumber:
          type: string
          format: uuid
        storeId:
          type: [integer, 'null']
          format: int64
        createdAt:
          type: [string, 'null']
          format: date-time
          description: UTC instant, ISO-8601 with a `Z` suffix.
          examples: ['2026-08-22T18:31:04Z']
        updatedAt:
          type: [string, 'null']
          format: date-time
        totalPrice:
          type: [number, 'null']
          format: double
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'
        orderType:
          $ref: '#/components/schemas/OrderType'

    CardInfo:
      type: object
      title: CardInfo
      description: Non-sensitive card summary echoed from Stripe. No PAN is ever stored.
      properties:
        cardBrand:
          type: [string, 'null']
          examples: [visa]
        cardLast4:
          type: [string, 'null']
          examples: ['4242']
        cardExpireMonth:
          type: [integer, 'null']
          format: int64
        cardExpireYear:
          type: [integer, 'null']
          format: int64

    ContactInfo:
      type: object
      title: ContactInfo
      properties:
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        email:
          type: [string, 'null']
          format: email
        phoneNum:
          type: [string, 'null']

    AddressInfo:
      type: object
      title: AddressInfo
      description: Delivery address. All fields are `null` for pickup orders.
      properties:
        streetAddr:
          type: [string, 'null']
        streetAddrDetail:
          type: [string, 'null']
        zipCode:
          type: [string, 'null']
        cityState:
          type: [string, 'null']
          description: 'City and state in one free-text field, e.g. `"Austin, TX"`.'

    OrderDetailResponse:
      type: object
      title: OrderDetailResponse
      description: |
        A persisted order in full. The nested product/rule/option/trait shapes match
        `OrderSessionResponse`, but the wire names come from Jackson renames that differ from
        the Java field names.
      properties:
        id:
          type: integer
          format: int64
        orderNumber:
          type: string
          format: uuid
        totalPrice:
          type: [number, 'null']
          format: double
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'
        orderType:
          $ref: '#/components/schemas/OrderType'
        orderDate:
          type: [string, 'null']
          format: date-time
          description: 'Named `orderDate` here but `createdAt` in `OrderSummary`, for the same value.'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        paymentMethod:
          anyOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        orderNote:
          type: [string, 'null']
        discountType:
          anyOf:
            - $ref: '#/components/schemas/DiscountType'
            - type: 'null'
        taxAmount:
          type: [number, 'null']
          format: double
        guestInfo:
          anyOf:
            - $ref: '#/components/schemas/GuestInfo'
            - type: 'null'
        cardInfo:
          anyOf:
            - $ref: '#/components/schemas/CardInfo'
            - type: 'null'
        contactInfo:
          anyOf:
            - $ref: '#/components/schemas/ContactInfo'
            - type: 'null'
        addressInfo:
          anyOf:
            - $ref: '#/components/schemas/AddressInfo'
            - type: 'null'
        productResponses:
          type: array
          description: 'Wire name from `@JsonProperty("productResponses")`; the Java field is `productResponse`.'
          items:
            $ref: '#/components/schemas/OrderProductResponse'
        storeResponse:
          anyOf:
            - $ref: '#/components/schemas/StoreResponse'
            - type: 'null'
          description: The fulfilling store, fully populated here.

    OrderProductResponse:
      type: object
      title: OrderProductResponse
      properties:
        id:
          type: integer
          format: int64
        storeProductId:
          type: integer
          format: int64
        quantity:
          type: [integer, 'null']
          format: int32
        name:
          type: string
        basePrice:
          type: [number, 'null']
          format: double
        extraPrice:
          type: [number, 'null']
          format: double
        totalPrice:
          type: [number, 'null']
          format: double
        imageSource:
          type: [string, 'null']
        calculatedCalories:
          type: [number, 'null']
          format: double
        productType:
          $ref: '#/components/schemas/ProductType'
        customRuleResponses:
          type: array
          description: 'Wire name from `@JsonProperty`; the Java field is `customRuleResponseDtos`.'
          items:
            $ref: '#/components/schemas/OrderCustomRuleResponse'

    OrderCustomRuleResponse:
      type: object
      title: OrderCustomRuleResponse
      properties:
        id:
          type: integer
          format: int64
        customRuleId:
          type: integer
          format: int64
        name:
          type: string
        calculatedPrice:
          type: [number, 'null']
          format: double
        optionResponses:
          type: array
          description: 'Wire name from `@JsonProperty`; the Java field is `optionResponseDtos`.'
          items:
            $ref: '#/components/schemas/OrderOptionResponse'

    OrderOptionResponse:
      type: object
      title: OrderOptionResponse
      properties:
        id:
          type: integer
          format: int64
        productOptionId:
          type: integer
          format: int64
        name:
          type: string
        countType:
          $ref: '#/components/schemas/CountType'
        basePrice:
          type: [number, 'null']
          format: double
        calculatedPrice:
          type: [number, 'null']
          format: double
        calculatedCalories:
          type: [number, 'null']
          format: double
        quantity:
          type: [integer, 'null']
          format: int32
        quantityDetail:
          anyOf:
            - $ref: '#/components/schemas/OrderQuantityDetail'
            - type: 'null'
        traitResponses:
          type: array
          description: 'Wire name from `@JsonProperty`; the Java field is `traitResponseDtos`.'
          items:
            $ref: '#/components/schemas/OrderTraitResponse'

    # -------------------------------------------------------------------------
    # Checkout
    # -------------------------------------------------------------------------
    OrderFormRequest:
      title: OrderFormRequest
      description: |
        Contact and fulfilment details, discriminated by `type`. Deserialized via Jackson
        `@JsonTypeInfo`/`@JsonSubTypes`, so an unknown `type` is a 400. There is no variant
        for `OrderType.DINE_IN`.
      oneOf:
        - $ref: '#/components/schemas/PickupOrderForm'
        - $ref: '#/components/schemas/DeliveryOrderForm'
      discriminator:
        propertyName: type
        mapping:
          pickup: '#/components/schemas/PickupOrderForm'
          delivery: '#/components/schemas/DeliveryOrderForm'

    PickupOrderForm:
      type: object
      title: PickupOrderForm
      required: [type]
      properties:
        type:
          type: string
          const: pickup
        orderNumber:
          type: [string, 'null']
          format: uuid
          description: |
            Redundant with the `orderSessionId` path variable. The handler does not check that
            the two agree.
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        eta:
          type: [string, 'null']
          format: date-time
          description: |
            Requested pickup time as a UTC instant. Not validated — a past time or a time
            outside the store's opening hours is accepted.
          examples: ['2026-08-23T19:15:00Z']
        email:
          type: [string, 'null']
          format: email
          description: 'Annotated `@Email`, but the handler omits `@Valid`, so the constraint is not enforced.'
        phoneNum:
          type: [string, 'null']

    DeliveryOrderForm:
      type: object
      title: DeliveryOrderForm
      required: [type]
      properties:
        type:
          type: string
          const: delivery
        orderNumber:
          type: [string, 'null']
          format: uuid
          description: Redundant with the `orderSessionId` path variable; consistency is not checked.
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        streetAddr:
          type: [string, 'null']
        streetAddrDetail:
          type: [string, 'null']
        zipCode:
          type: [string, 'null']
        cityState:
          type: [string, 'null']
          description: 'City and state in one free-text field, e.g. `"Austin, TX"`.'
        email:
          type: [string, 'null']
          format: email
          description: 'Annotated `@Email`, but not enforced (no `@Valid`).'
        phoneNum:
          type: [string, 'null']
        # Note: no field on this form is required, so a delivery order can be created with
        # no address at all.

    CheckoutResponse:
      type: object
      title: CheckoutResponse
      properties:
        successUrl:
          type: string
          format: uri
          description: |
            **Misnamed.** This is the Stripe Checkout URL the client must redirect the browser
            to — not the post-payment success URL.
          examples: ['https://checkout.stripe.com/c/pay/cs_test_a1B2c3D4e5F6g7H8i9J0kLmNoPqRsTuVwXyZ']

    StripeEvent:
      type: object
      title: StripeEvent
      description: |
        Stripe event envelope, documented loosely because the handler reads the raw body
        rather than binding a DTO. See Stripe's own API reference for the authoritative
        shape.
      properties:
        id:
          type: string
          examples: [evt_1P2Q3R4S5T6U7V8W]
        object:
          type: string
          const: event
        type:
          type: string
          description: |
            Handled: `checkout.session.completed`, `payment_intent.succeeded`. Accepted and
            ignored: `payment_method.attached`. Anything else is logged and ignored.
          examples: [checkout.session.completed]
        created:
          type: integer
          format: int64
        data:
          type: object
          properties:
            object:
              type: object
              description: The Stripe object the event is about.
              additionalProperties: true
      additionalProperties: true
